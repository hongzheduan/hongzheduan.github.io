<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baizora | Login</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/baize_favicon_v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/baize_favicon_v2.png">
  <link rel="apple-touch-icon" href="assets/baize_favicon_v2.png">

  <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;  /* horizontal center */
        align-items: center;      /* vertical center */
        background: #0b0d12;      /* optional (match your dark theme) */
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 280px;
    }

    input {
        padding: 10px;
        border-radius: 6px;
        border: none;
    }

    button {
        padding: 10px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
    }

    .logo {
        position: absolute;
        top: 20px;
        left: 20px;
    }

    .logo img {
        height: 58px;
    }

  </style>
</head>

<body>

    <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const res = await fetch(
        `https://us-central1-baizora.cloudfunctions.net/api/get-user?uid=${user.uid}`
    );

    const data = await res.json();

    if (data.subscriptionStatus !== "active") {
        window.location.href = "pricing.html";
    }
    });
    </script>

    <div class="container">

        <div class="logo">
            <a href="./">
                <img src="assets/baize_logo_v2.png" alt="Baizora Logo">
            </a>
        </div>

        <h2>Login</h2>

        <input id="email" placeholder="Email" />
        <!-- <input id="password" type="password" placeholder="Password" />
        <button onclick="login()">Login</button> -->

        <input id="password" type="password" placeholder="Password" />

        <p style="margin:0; text-align:right; font-size:13px;">
        <a href="#" onclick="resetPassword(); return false;" style="color:#9ca3af; text-decoration:none;">
            Forgot password?
        </a>
        </p>

        <button onclick="login()">Login</button>


        <p><a href="signup.html">Create Account</a></p>

    </div>

    <script type="module">
    import { auth } from "./firebase.js";
    import {
        signInWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    window.login = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "dashboard.html";
    } catch (e) {
        alert(e.message);
    }
    };

    window.resetPassword = async function () {

        const email = document.getElementById("email").value.trim();

        if (!email) {
            alert("Please enter your email first.");
            return;
        }

        try {
            await sendPasswordResetEmail(auth, email);
            alert("Password reset email sent. Please check your inbox.");
        } catch (e) {
            alert(e.message);
        }
    };


    </script>

</body>
</html>
