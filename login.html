<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baizora | Login</title>

<link rel="icon" type="image/png" sizes="32x32" href="assets/baize_favicon_v2.png">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b0d12;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:300px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

input{
    padding:10px;
    border:none;
    border-radius:6px;
}

button{
    padding:10px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.logo{
    position:absolute;
    top:20px;
    left:20px;
}

.logo img{height:58px;}

.small{
    font-size:13px;
    color:#9ca3af;
}

a{
    color:#9ca3af;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="logo">
<a href="./">
<img src="assets/baize_logo_v2.png">
</a>
</div>

<div class="container">

<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div style="text-align:right;">
<a href="#" onclick="resetPassword();return false;">Forgot password?</a>
</div>

<button onclick="login()">Login</button>

<div class="small">
<a href="signup.html">Create Account</a>
</div>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
signInWithEmailAndPassword,
sendPasswordResetEmail,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* AUTO REDIRECT ONLY IF ALREADY LOGGED IN */
onAuthStateChanged(auth, async(user)=>{

    if(!user) return;   // stay on login page

    try{

        const res = await fetch(
        `https://us-central1-baizora.cloudfunctions.net/api/get-user?uid=${user.uid}`
        );

        const data = await res.json();

        if(data.subscriptionStatus === "active"){
            window.location.href = "dashboard.html";
        }else{
            window.location.href = "pricing.html";
        }

    }catch(e){
        window.location.href = "dashboard.html";
    }

});

/* LOGIN */
window.login = async function(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{

    await signInWithEmailAndPassword(auth,email,password);

}catch(e){
    alert(e.message);
}

}

/* RESET */
window.resetPassword = async function(){

const email=document.getElementById("email").value.trim();

if(!email){
    alert("Enter email first.");
    return;
}

try{
    await sendPasswordResetEmail(auth,email);
    alert("Password reset email sent.");
}catch(e){
    alert(e.message);
}

}

</script>

</body>
</html>
