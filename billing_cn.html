<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baizora | 定价</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/baize_favicon_v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/baize_favicon_v2.png">
  <link rel="apple-touch-icon" href="assets/baize_favicon_v2.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy:#060d1f;
      --navy-mid:#0d1e3d;
      --navy-light:#162847;
      --electric:#3b82f6;
      --electric-bright:#60a5fa;
      --gold:#f59e0b;
      --gold-light:#fcd34d;
      --white:#f8fafc;
      --muted:#94a3b8;
      --border:rgba(255,255,255,0.07);
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    body{
      font-family:'DM Sans',sans-serif;
      background:var(--navy);
      color:var(--white);
      overflow-x:hidden;
      min-height:100vh;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);
      background-size:60px 60px;
      pointer-events:none;
      z-index:0;
    }

    body::after{
      content:'';
      position:fixed;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
      opacity:0.4;
    }

    .glow{
      position:fixed;
      top:0;left:50%;
      transform:translateX(-50%);
      width:800px;height:500px;
      background:radial-gradient(ellipse at center,rgba(59,130,246,0.1) 0%,transparent 70%);
      pointer-events:none;
      z-index:0;
    }

    header{
      position:sticky;
      top:0;
      z-index:200;
      backdrop-filter:blur(20px);
      background:rgba(6,13,31,0.85);
      border-bottom:1px solid var(--border);
      padding:0 40px;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
    }

    .logo-wrap img{height:36px;}

    .logo-text{
      font-family:'DM Serif Display',serif;
      font-size:24px;
      color:var(--white);
    }

    .logo-text span{color:var(--electric);}

    .brand-cn {
      font-family: var(--font-cn);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(90deg, var(--white), var(--electric-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-btn{
      border:1px solid var(--border);
      background:transparent;
      color:var(--muted);
      padding:7px 18px;
      border-radius:7px;
      text-decoration:none;
      font-size:13px;
    }

    .nav-btn:hover{
      border-color:rgba(59,130,246,0.4);
      color:var(--white);
      background:rgba(59,130,246,0.08);
    }

    .container{
      position:relative;
      z-index:10;
      max-width:900px;
      margin:0 auto;
      padding:80px 20px 100px;
      text-align:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      font-size:10px;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:var(--electric-bright);
      border:1px solid rgba(59,130,246,0.25);
      background:rgba(59,130,246,0.06);
      padding:6px 14px;
      border-radius:999px;
      margin-bottom:24px;
    }

    h1{
      font-family:'DM Serif Display',serif;
      font-size:clamp(36px,5vw,60px);
      margin-bottom:16px;
    }

    h1 em{color:var(--electric-bright);font-style:italic;}

    .subtext{
      color:var(--muted);
      max-width:480px;
      margin:0 auto 60px;
      font-size:15px;
      line-height:1.7;
    }

    .pricing-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
      max-width:720px;
      margin:0 auto;
    }

    .plan{
      background:rgba(13,30,61,0.6);
      border:1px solid var(--border);
      border-radius:20px;
      padding:32px 28px;
      text-align:left;
      display:flex;
      flex-direction:column;
    }

    .plan.featured{
      background:rgba(59,130,246,0.07);
      border-color:rgba(59,130,246,0.35);
    }

    .plan-name{
      font-size:11px;
      letter-spacing:0.15em;
      color:var(--muted);
      margin-bottom:16px;
      text-transform:uppercase;
    }

    .price{
      font-family:'DM Serif Display',serif;
      font-size:56px;
    }

    .period{
      font-size:11px;
      color:#475569;
      margin-bottom:10px;
    }

    ul{
      list-style:none;
      margin-top:20px;
      flex:1;
    }

    li{
      color:var(--muted);
      font-size:13px;
      margin-bottom:10px;
    }

    .btn{
      margin-top:20px;
      padding:12px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }

    .btn-primary{
      background:var(--electric);
      color:white;
    }

    /* Buttons */
    .plan-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
    }

    .btn-outline:hover {
      border-color: rgba(59,130,246,0.4);
      color: var(--white);
      background: rgba(59,130,246,0.06);
    }

    .btn-filled {
      background: var(--electric);
      border: none;
      color: white;
      box-shadow: 0 0 24px rgba(59,130,246,0.25);
    }

    .btn-filled:hover {
      background: #2563eb;
      box-shadow: 0 0 36px rgba(59,130,246,0.4);
      transform: translateY(-1px);
    }

    .btn-filled:active, .btn-outline:active { transform: translateY(0); }

    .plan-btn:disabled {
      opacity: 0.6;
      pointer-events: none;
    }

    footer{
      border-top:1px solid var(--border);
      padding:28px 40px;
      display:flex;
      justify-content:space-between;
      font-size:11px;
      color:#475569;
    }

    @media(max-width:768px){
      .pricing-grid{grid-template-columns:1fr;}
      footer{flex-direction:column;gap:12px;text-align:center;}
    }
  </style>
</head>

<body>

<div class="glow"></div>

<header>
   <a href="./index_cn.html" class="logo-wrap">
      <img src="assets/baize_favicon_v2.png" alt="Baizora">
      <div class="brand-cn">贝佐拉</div>
   </a>
  <a href="login.html" class="nav-btn">登录</a>
</header>

<div class="container">

  <div class="eyebrow">◈ 定价</div>

  <h1>简单、透明的定价</h1>

  <div class="subtext">
    随时取消，无隐藏费用。注册即可获得完整平台访问权限。
  </div>

  <div class="pricing-grid">

    <!-- Monthly -->
    <div class="plan">
      <div class="plan-name">月付方案</div>
      <div class="price">$9.99</div>
      <div class="period">每月</div>

      <ul>
        <li>• 完整仪表盘访问</li>
        <li>• 每日更新数据</li>
        <li>• 短期分析窗口</li>
        <li>• 行为信号指标</li>
      </ul>

      <button class="plan-btn btn-outline" onclick="startCheckout('monthly', this)">
          <span class="btn-label">选择月付</span>
          <div class="spinner"></div>
        </button>

    </div>

    <!-- Yearly -->
    <div class="plan featured">
      <div class="plan-name">年付方案 · 推荐</div>
      <div class="price">$99</div>
      <div class="period">每年</div>

      <ul>
        <li>• 包含月付全部功能</li>
        <li>• 显著降低长期使用成本</li>
        <li>• 价格锁定一整年，不受未来涨价影响</li>
        <li>• 更适合长期稳定使用用户</li>
      </ul>

      <button class="plan-btn btn-filled" onclick="startCheckout('yearly', this)">
        <span class="btn-label">选择年付</span>
        <div class="spinner"></div>
      </button>

    </div>

  </div>

</div>

<footer>
  <div>© 2026 Baizora</div>
  <div>support@baizora.com</div>
</footer>

 <script>
    const API_URL = "https://us-central1-baizora.cloudfunctions.net/api";

    async function startCheckout(plan, btn) {
      const label = btn.querySelector('.btn-label');
      const spinner = btn.querySelector('.spinner');

      label.style.display = 'none';
      spinner.style.display = 'block';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/create-${plan}`, { method: "POST" });
        const data = await res.json();

        if (!data.url) {
          throw new Error("Payment session failed.");
        }

        window.location.href = data.url;

      } catch (err) {
        console.error(err);
        label.style.display = 'flex';
        spinner.style.display = 'none';
        btn.disabled = false;
        alert(err.message || "Network error. Please try again.");
      }
    }
  </script>

</body>
</html>
