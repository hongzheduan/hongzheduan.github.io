<h1>常见问题</h1>

<div class="q">1. 如何取消订阅？</div>
<div class="a">
如果您已开通订阅，可在账户页面（现在加入）中随时取消。
取消后不会再产生后续费用。
</div>

<div class="q">2. 是否可以免费查看数据？</div>
<div class="a">
可以。平台提供免费预览功能，无需登录即可查看部分市场数据内容。
</div>

<div class="q">3. 7天免费试用如何运作？</div>
<div class="a">
新用户可享受7天完整功能试用。试用期间可随时取消，不会产生费用。
</div>

<div class="q">4. 如何联系支持？</div>
<div class="a">
您可以通过邮箱联系我们：support@baizora.com，我们通常会在1-2个工作日内回复。
</div>
