<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xStockEdge Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .card {
      background: #111;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      text-align: left;
    }

    footer {
      margin-top: 40px;
      color: #aaa;
      font-size: 12px;
    }

    .tag {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📊 xStockEdge Dashboard</h1>
  <div class="tag">Live market signals (beta)</div>

  <div id="signals-container"></div>

  <footer>
    © 2026 xStockEdge
  </footer>

</div>

<script type="module">
import { processSignals } from "./signalEngine.js";

fetch("data/latest.json")
  .then(res => res.json())
  .then(data => {

    // use shared logic (no duplication)
    const signals = processSignals(data);

    const container = document.getElementById("signals-container");
    container.innerHTML = "";

    signals.forEach(stock => {

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${stock.ticker}</h3>
        <p><strong>Price:</strong> $${stock.price}</p>
        <p><strong>RelVol:</strong> ${stock.relVol}</p>
        <p><strong>Max RelVol (7D):</strong> ${stock.maxRelVol}</p>
        <p><strong>1D:</strong> ${stock.change1d}%</p>
        <p><strong>7D:</strong> ${stock.change7d}%</p>
        <p><strong>Signal:</strong> ${stock.signal}</p>
      `;

      container.appendChild(card);
    });

  })
  .catch(err => {
    console.error(err);
    document.getElementById("signals-container").innerHTML =
      "<p style='color:red'>Failed to load data</p>";
  });

</script>

</body>
</html>
