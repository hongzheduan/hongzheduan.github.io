<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xStockEdge Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .live {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #0f172a;
      color: #22c55e;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .card {
      background: #111;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    #lastUpdated {
      color: #aaa;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN GUARD -->
  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <!-- TOP BAR -->
  <div class="topbar">
    <div>
      <h1>📊 Dashboard</h1>
      <div class="sub">Live stock signal engine</div>

      <div id="userInfo" style="color:#aaa;font-size:12px;"></div>

    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="live">● LIVE SCANNING</div>

  <button class="refresh" onclick="loadData()">Refresh</button>

  <div id="lastUpdated"></div>

  <!-- SIGNALS -->
  <div id="signals-container"></div>

</div>

<script>
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

function loadData() {

  const container = document.getElementById("signals-container");

  container.innerHTML = "<div class='card'>Loading signals...</div>";

  const email = localStorage.getItem("userEmail") || "";
  fetch(`http://127.0.0.1:8000/signals?email=${email}`)
  // fetch("http://127.0.0.1:8000/signals")
    .then(res => res.json())
    .then(response => {

      const data = response.data;
      const timestamp = response.timestamp;
      const tier = response.tier;

      if (!data || data.length === 0) {
        container.innerHTML = "<div class='card'>No signals found</div>";
        return;
      }

      document.getElementById("userInfo").innerText =
        "Plan: " + tier.toUpperCase();

      document.getElementById("lastUpdated").innerText =
        "Last updated: " + timestamp;

      const displayData = data;

      container.innerHTML = "";

      if (tier === "free") {
        const hint = document.createElement("div");
        hint.style.color = "#fbbf24";
        hint.style.margin = "10px 0";
        hint.innerText = "Upgrade to Premium to unlock all signals →";

        container.appendChild(hint);
      }

      displayData.sort((a, b) => {
        const scoreA = a.maxRelVol * Math.abs(a.change7d);
        const scoreB = b.maxRelVol * Math.abs(b.change7d);
        return scoreB - scoreA; // highest score first
      });

      displayData.forEach(stock => {

        const score = stock.maxRelVol * Math.abs(stock.change7d/100);
        let scoreLabel = "";
        if (score < 0.5) {
          scoreLabel = "Weak";
        } else if (score < 1.5) {
          scoreLabel = "Moderate";
        } else if (score < 3) {
          scoreLabel = "Strong";
        } else {
          scoreLabel = "Very Strong";
        }

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h3 style="margin-bottom:6px;">${stock.ticker || "N/A"}</h3>
          <p><strong>Price:</strong> $${stock.price}</p>
          <p><strong>RelVol:</strong> ${stock.relVol}</p>
          <p><strong>7D Max RelVol:</strong> ${stock.maxRelVol}</p>
          <p><strong>1D:</strong> ${stock.change1d}%</p>
          <p>
            <strong>Signal Strength:</strong>
            <span style="
              color: 
                ${scoreLabel === "Very Strong" ? "#ef4444" :
                  scoreLabel === "Strong" ? "#fbbf24" :
                  scoreLabel === "Moderate" ? "#60a5fa" :
                  "#9ca3af"};
              font-weight:bold;
            ">
              ${scoreLabel}
            </span>
          </p>
        `;

        container.appendChild(card);
      });

    })
    .catch(err => {
      console.error(err);
      document.getElementById("signals-container").innerHTML =
        "<div class='card' style='color:red'>Failed to load data</div>";
    });
}

// auto load on open
loadData();

// auto refresh every 30 sec
setInterval(loadData, 30000);
</script>

</body>
</html>
