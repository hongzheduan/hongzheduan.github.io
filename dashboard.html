<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baizora Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    /* ===== LAYOUT ===== */
    .layout {
      display: flex;
      height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 220px;
      background: #0a0a0a;
      border-right: 1px solid #222;
      padding: 15px;
    }

    .logo img {
      height: 60px;
      cursor: pointer;
    }

    .menu-title {
      color: #888;
      font-size: 12px;
      margin: 20px 0 10px;
    }

    .menu-btn {
      width: 100%;
      background: #111;
      color: #fff;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      text-align: left;
      border: none;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #1f1f1f;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
    }

    .sub {
      color: #aaa;
      font-size: 14px;
      margin-top: 4px;
    }

    #todayDate {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    #userInfo {
      color: #aaa;
      font-size: 12px;
      margin-top: 6px;
    }

    /* ===== CARDS ===== */
    .card {
      background: #111;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #222;
    }

    /* ===== BUTTON ===== */
    .logout {
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- LOGIN GUARD -->
<script>
  if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
  }
</script>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">

    <div class="logo">
      <a href="index.html">
        <img src="assets/baize_logo.png" alt="Baizora Logo">
      </a>
    </div>

    <div class="menu-title">SCANNERS</div>

    <button class="menu-btn" onclick="loadScanner('volume')">
      📊 Volume Breakouts
    </button>

    <button class="menu-btn" onclick="loadScanner('momentum')">
      ⚡ Momentum Shift
    </button>

    <button class="menu-btn" onclick="loadScanner('breakout')">
      🚀 Breakout Strength
    </button>

  </div>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <div class="topbar">
      <div>
        <h1>Baizora Terminal</h1>

        <div class="sub">Daily Quant Signal Engine</div>

        <div style="color:#22c55e; font-size:12px; margin-top:4px;">
          Signals update after 6:00 PM ET
        </div>

        <div id="todayDate"></div>
        <div id="userInfo"></div>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div id="signals-container">
      <div class="card">Select a scanner to view signals</div>
    </div>

  </div>

</div>

<script>
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

/* ===== INIT DATE ===== */
window.onload = function () {
  const today = new Date();

  document.getElementById("todayDate").innerText =
    today.toLocaleDateString("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });
};

/* ===== SCANNER LOADER ===== */
function loadScanner(type) {

  const container = document.getElementById("signals-container");

  container.innerHTML = "<div class='card'>Loading " + type + " signals...</div>";

  let file = "data/signals.json";

  if (type === "volume") {
    file = "data/signals_volume.json";
  } else if (type === "momentum") {
    file = "data/signals_momentum.json";
  } else if (type === "breakout") {
    file = "data/signals_breakout.json";
  }

  fetch(file)
    .then(res => res.json())
    .then(response => {

      const data = response.data;

      document.getElementById("userInfo").innerText =
        "Scanner: " + type.toUpperCase();

      container.innerHTML = "";

      if (!data || data.length === 0) {
        container.innerHTML = "<div class='card'>No signals found</div>";
        return;
      }

      data.forEach(stock => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h3>${stock.Ticker}</h3>
          <p><strong>Price:</strong> $${stock.Price}</p>
          <p><strong>RelVol:</strong> ${stock.RelVol}</p>
          <p><strong>7D Max:</strong> ${stock.MaxRelVol_7D}</p>
          <p><strong>1D:</strong> ${stock.Change1D}%</p>
          <p><strong>Signal:</strong> ${stock.Signal}</p>
        `;

        container.appendChild(card);
      });

    })
    .catch(err => {
      console.error(err);
      container.innerHTML =
        "<div class='card' style='color:red'>Failed to load signals</div>";
    });
}
</script>

</body>
</html>
