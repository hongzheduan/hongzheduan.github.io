<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baizora Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0;
    }

    .sub {
      color: #aaa;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #111;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      gap: 20px;
    }

    .logo img {
      height: 44px;
      cursor: pointer;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .refresh {
      background: #2563eb;
      color: white;
      margin-bottom: 15px;
    }

    #lastUpdated {
      color: #aaa;
      font-size: 12px;
      margin-top: 10px;
    }

    #todayDate {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    #userInfo {
      color: #aaa;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN GUARD -->
  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <!-- TOP BAR -->
  <div class="topbar">

    <!-- LOGO -->
    <div class="logo">
      <a href="index.html">
        <img src="assets/baize_logo.png" alt="Baizora Logo">
      </a>
    </div>

    <!-- CENTER -->
    <div style="flex:1; text-align:center;">
      <h1>Dashboard</h1>


      <div style="color:#22c55e; font-size:12px; margin-top:4px;">
        Signals update daily after 6:00 PM ET
      </div>

      <div id="todayDate"></div>
      <div id="userInfo"></div>
    </div>

    <!-- RIGHT -->
    <button class="logout" onclick="logout()">Logout</button>

  </div>

  <!-- BUTTON -->
  <button class="refresh" onclick="loadData()">Load Today's Signals</button>

  <div id="lastUpdated"></div>

  <!-- SIGNALS -->
  <div id="signals-container"></div>

</div>

<script>
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

/* Set date once */
window.onload = function () {

  const today = new Date();

  document.getElementById("todayDate").innerText =
    today.toLocaleDateString("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

  loadData();
};

/* Load signals once */
function loadData() {

  const container = document.getElementById("signals-container");

  container.innerHTML = "<div class='card'>Loading signals...</div>";

  fetch("data/signals.json")
    .then(res => res.json())
    .then(response => {

      const data = response.data;
      const timestamp = response.timestamp;
      const tier = response.tier;

      if (!data || data.length === 0) {
        container.innerHTML = "<div class='card'>No signals found</div>";
        return;
      }

      document.getElementById("userInfo").innerText =
        "Plan: " + tier.toUpperCase();

      document.getElementById("lastUpdated").innerText =
        "Last updated: " + timestamp;

      container.innerHTML = "";

      data.forEach(stock => {

        const score =
          stock.maxRelVol * Math.abs(stock.change7d / 100);

        let label = "";

        if (score < 0.5) label = "Weak";
        else if (score < 1.5) label = "Moderate";
        else if (score < 3) label = "Strong";
        else label = "Very Strong";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h3 style="margin-bottom:6px;">${stock.ticker}</h3>
          <p><strong>Price:</strong> $${stock.price}</p>
          <p><strong>RelVol:</strong> ${stock.relVol}</p>
          <p><strong>7D Max RelVol:</strong> ${stock.maxRelVol}</p>
          <p><strong>1D:</strong> ${stock.change1d}%</p>
          <p>
            <strong>Signal:</strong>
            <span style="color:
              ${label === "Very Strong" ? "#ef4444" :
                label === "Strong" ? "#fbbf24" :
                label === "Moderate" ? "#60a5fa" :
                "#9ca3af"};
              font-weight:bold;">
              ${label}
            </span>
          </p>
        `;

        container.appendChild(card);
      });

    })
    .catch(err => {
      console.error(err);
      container.innerHTML =
        "<div class='card' style='color:red'>Failed to load signals</div>";
    });
}
</script>

</body>
</html>
