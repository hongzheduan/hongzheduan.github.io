<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DWEPM8KFM9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DWEPM8KFM9');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baizora | Custom Tracker</title>
  <meta name="description" content="Custom Tracker: a daily S&amp;P 500 and Nasdaq-100 list built from a custom rule.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/baizora_logo_arrow.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #012169;
      --navy-mid: #0d1e3d;
      --navy-light: #162847;
      --electric: #3b82f6;
      --electric-bright: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --green: #64c487;
      --red: #c46464;
      --white: #ffffff;
      --muted: #cbd5e1;
      --border: rgba(255,255,255,0.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: rgba(1,33,105,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 12px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-wrap img { height: 36px; }

    .logo-text {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(20px, 5vw, 30px);
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-email {
      display: inline-flex;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: default;
    }

    .nav-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-btn:hover { border-color: rgba(59,130,246,0.4); color: var(--white); background: rgba(59,130,246,0.08); }
    .nav-btn-danger { border-color: rgba(239,68,68,0.2); color: #fca5a5; }
    .nav-btn-danger:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.4); }

    /* ── PAGE ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .page-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--electric-bright);
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(26px, 4vw, 36px);
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .page { max-width: 1000px; }
    .page-sub { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 400; color: #e2e8f0; letter-spacing: 0.04em; margin-bottom: 18px; }
    /* ── BAIZORA TRACKER ── (card/table styling follows se_tracker.html) */
    .bt-info { max-width: 820px; font-size: 14px; line-height: 1.65; color: #cbd5e1; margin: 0 0 10px; }
    .bt-info a { color: #93c5fd; }
    .bt-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--electric-bright); margin: 34px 0 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
    .bt-label span { color: #e2e8f0; letter-spacing: 0.04em; text-transform: none; }
    .bt-card { background: #ffffff; border: 1px solid rgba(15,23,42,0.06); border-radius: 16px; padding: 8px 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.35); overflow-x: auto; }
    .bt-table { width: 100%; border-collapse: collapse; font-size: 14px; color: #0f172a; }
    .bt-table th { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #475569; text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(15,23,42,0.08); white-space: nowrap; }
    .bt-table td { padding: 12px 10px; border-bottom: 1px solid rgba(15,23,42,0.06); vertical-align: middle; }
    .bt-table tr:last-child td { border-bottom: none; }
    .bt-num { font-family: 'DM Mono', monospace; font-size: 13px; white-space: nowrap; text-align: right; }
    th.bt-num { text-align: right; }
    .bt-rank { font-family: 'DM Mono', monospace; font-size: 12px; color: #475569; }
    .bt-tk { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 700; color: #0f172a; }
    .bt-co { font-size: 12px; color: #334155; margin-top: 2px; }
    .bt-sec { font-size: 13px; color: #334155; }
    .bt-conv { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 700; color: #0f766e; }
    .bt-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: #475569; margin-top: 2px; white-space: nowrap; }
    .bt-why { display: flex; flex-wrap: wrap; gap: 5px; }
    .bt-chip { font-family: 'DM Mono', monospace; font-size: 11px; color: #334155; background: #f1f5f9; border: 1px solid rgba(15,23,42,0.08); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
    .up { color: #15803d; } .dn { color: #b91c1c; }
    .bt-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px 0; }
    .bt-sum div { text-align: center; }
    .bt-sum b { display: block; font-family: 'DM Serif Display', serif; font-size: 28px; font-weight: 400; color: #0f172a; }
    .bt-sum small { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #475569; }
    .bt-picks { display: flex; flex-wrap: wrap; gap: 4px; }
    .bt-pick { font-family: 'DM Mono', monospace; font-size: 11px; border-radius: 6px; padding: 2px 6px; white-space: nowrap; background: #f8fafc; border: 1px solid rgba(15,23,42,0.08); color: #0f172a; }
    .bt-pick i { font-style: normal; margin-left: 4px; }
    .bt-date { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; white-space: nowrap; }
    .bt-more { display: block; margin: 12px auto 4px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #1d4ed8; background: none; border: 1px solid rgba(29,78,216,0.3); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
    .bt-empty { text-align: center; padding: 34px 0; color: #334155; font-family: 'DM Mono', monospace; font-size: 12px; }
    .bt-foot { font-family: 'DM Mono', monospace; font-size: 11px; color: #cbd5e1; margin-top: 18px; line-height: 1.7; }
    @media (max-width: 640px) {
      .bt-card { padding: 4px 12px; }
      .bt-hide-m { display: none; }
      .bt-table td { padding: 10px 6px; font-size: 13px; }
      .bt-table th { padding: 10px 6px; }
      .bt-sum b { font-size: 22px; }
    }
    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .page { padding: 28px 16px 60px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="./" class="logo-wrap">
      <span class="logo-text">Baiz<span style="color:#60a5fa;">ora</span></span>
      <img src="assets/baizora_logo_arrow.png" alt="" class="logo-mark" style="height:26px;width:26px;">
    </a>
    <div class="header-right">
      <span class="user-email" id="headerEmail"></span>
      <a href="dashboard.html" class="nav-btn">Dashboard</a>
      <button class="nav-btn nav-btn-danger" onclick="doLogout()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </header>


  <div class="page">

    <div class="page-eyebrow">◈ &nbsp; Trackers</div>
    <h1 class="page-title">Custom Tracker</h1>
    <p class="page-sub">S&amp;P 500 &nbsp;·&nbsp; Nasdaq-100</p>

    <p class="bt-info">This tracker does not have a rule yet. Once a rule is set, a daily list and the track record of
      every past list will appear here.</p>

    <div class="bt-label">Today's list</div>
    <div class="bt-card">
      <table class="bt-table">
        <tbody><tr><td class="bt-empty">No list yet.</td></tr></tbody>
      </table>
    </div>

    <div class="bt-foot">For informational purposes only. Not investment advice.</div>

  </div>

  <script src="assets/feature_flags.js?v=4"></script>
  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Sign-in required only (same access level the homepage section had); no subscription check.
    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      const hEl = document.getElementById("headerEmail"); hEl.textContent = user.email[0].toUpperCase(); hEl.title = user.email;
    });

    window.doLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };
  </script>

</body>
</html>
