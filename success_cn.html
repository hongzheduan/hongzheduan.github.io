<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付成功 | 贝佐拉</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/baize_favicon_v2.png">
  <link rel="apple-touch-icon" href="assets/baize_favicon_v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #060d1f;
      --electric: #3b82f6;
      --electric-bright: #60a5fa;
      --white: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.12);
      --positive: #22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .glow {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(59,130,246,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-green {
      position: fixed;
      top: 30%; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse at center, rgba(34,197,94,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER */
    header {
      position: relative;
      z-index: 100;
      flex-shrink: 0;
      height: 56px;
      background: rgba(6,13,31,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      padding: 0 32px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .header-logo img { height: 36px; }

    .brand-cn {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(90deg, var(--white), var(--electric-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* PAGE BODY */
    .page-body {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(10, 22, 40, 0.85);
      border: 1px solid var(--border-bright);
      border-radius: 16px;
      padding: 44px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(34,197,94,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34,197,94,0.4), transparent);
    }

    /* CHECK ICON */
    .check-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .check-wrap svg { width: 28px; height: 28px; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .card-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--positive);
      margin-bottom: 10px;
      animation: fadeUp 0.4s 0.1s ease both;
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      letter-spacing: -0.02em;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 12px;
      animation: fadeUp 0.4s 0.15s ease both;
    }

    .card-sub {
      font-size: 14px;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.75;
      margin-bottom: 32px;
      animation: fadeUp 0.4s 0.2s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* BUTTON */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--electric), #2563eb);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 0 24px rgba(59,130,246,0.25);
      animation: fadeUp 0.4s 0.25s ease both;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 0 36px rgba(59,130,246,0.4);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }

    .card-divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0 20px;
      animation: fadeUp 0.4s 0.3s ease both;
    }

    .card-note {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #334155;
      animation: fadeUp 0.4s 0.3s ease both;
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      flex-shrink: 0;
    }
    .footer-left {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.05em;
    }
    .footer-left a { color: inherit; text-decoration: none; }
    .footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
    .footer-links a {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #475569;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--electric-bright); }

    @media (max-width: 480px) {
      header { padding: 0 16px; height: 56px; }
      .header-logo img { height: 28px; }
      .brand-cn { font-size: 17px; letter-spacing: 3px; }
      .card { padding: 32px 22px; border-radius: 12px; }
      .card-title { font-size: 24px; }
      footer { padding: 16px 20px; flex-direction: column; text-align: center; }
      .footer-links { justify-content: center; }
    }
  </style>
</head>

<body>
  <div class="glow"></div>
  <div class="glow-green"></div>

  <header>
    <a href="./index_cn.html" class="header-logo">
      <img src="assets/baize_favicon_v2.png" alt="贝佐拉">
      <div class="brand-cn">贝佐拉</div>
    </a>
  </header>

  <div class="page-body">
    <div class="card">

      <div class="check-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <div class="card-eyebrow">◈ &nbsp; 支付确认</div>
      <h1 class="card-title">订阅已开通</h1>
      <p class="card-sub">
        您的订阅正在激活中，通常只需几秒钟。前往个人主页，即可开始探索全部 500+ 只股票的市场信号。
      </p>

      <a href="dashboard_cn.html" class="btn-primary">
        进入个人主页
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <div class="card-divider"></div>
      <p class="card-note">贝佐拉 · 订阅已生效</p>

    </div>
  </div>

  <footer>
    <div class="footer-left">© 2026 Baizora &nbsp;·&nbsp; <a href="mailto:support@baizora.com">support@baizora.com</a></div>
    <div class="footer-links">
      <a href="assets/privacy_cn.html">隐私政策</a>
      <a href="assets/disclaimer_cn.html">免责声明</a>
      <a href="assets/terms_cn.html">服务条款</a>      
      <a href="assets/faq_cn.html">常见问题</a>
    </div>
  </footer>

</body>
</html>
