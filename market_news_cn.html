  <style>
    :root {
      --navy: #060d1f;
      --navy-mid: #0d1e3d;
      --navy-light: #162847;
      --electric: #3b82f6;
      --electric-bright: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --green: #22c55e;
      --red: #ef4444;
      --white: #ffffff;
      --muted: #cbd5e1;
      --border: rgba(255,255,255,0.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: rgba(6,13,31,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 12px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-wrap img { height: 36px; }

    .brand-cn {
      font-size: clamp(18px, 4.5vw, 27px);
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(90deg, var(--white), var(--electric-bright));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-email {
      display: inline-flex;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: default;
    }

    .nav-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-btn:hover { border-color: rgba(59,130,246,0.4); color: var(--white); background: rgba(59,130,246,0.08); }
    .nav-btn-danger { border-color: rgba(239,68,68,0.2); color: #fca5a5; }
    .nav-btn-danger:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.4); }

    /* ── PAGE ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .page-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--electric-bright);
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(26px, 4vw, 36px);
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    /* info banner */
    .info-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(251,146,60,0.08);
      border: 1px solid rgba(251,146,60,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 32px;
      font-size: 13px;
      color: #fdba74;
      line-height: 1.5;
    }

    /* meta row */
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .last-updated {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #64748b;
    }

    /* news item */
    .news-item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      align-items: flex-start;
    }

    .news-item:last-child { border-bottom: none; }

    .news-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      padding-top: 2px;
      min-width: 76px;
    }

    .news-body { flex: 1; min-width: 0; }

    .news-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--white);
      text-decoration: none;
      line-height: 1.5;
      display: block;
      margin-bottom: 4px;
      transition: color 0.15s;
    }

    .news-title:hover { color: var(--electric-bright); }

    .news-source {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #64748b;
    }

    /* empty / loading */
    .state-msg {
      font-size: 13px;
      color: #64748b;
      padding: 32px 0;
      text-align: center;
    }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .page { padding: 28px 16px 60px; }
      .news-date { min-width: 60px; font-size: 10px; }
    }

<body>

  <header>
    <a href="./" class="logo-wrap">
      <span class="brand-cn">贝佐拉</span>
    </a>
    <div class="header-right">
      <span class="user-email" id="headerEmail"></span>
      <a href="dashboard_cn.html" class="nav-btn">个人主页</a>
      <button class="nav-btn nav-btn-danger" onclick="doLogout()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出登录
      </button>
    </div>
  </header>

  <div class="page">

    <div class="page-eyebrow">◈ &nbsp; 市场资讯</div>
    <h1 class="page-title">市场资讯</h1>
    <p class="page-sub">今日市场新闻要闻，来源于金融新闻媒体，每日更新。</p>

    <div class="info-banner">
      新闻通过 Google News RSS 抓取，代表第三方媒体观点，不代表平台立场。点击标题可跳转至原文来源。
    </div>

    <div class="meta-row">
      <div class="section-label">◈ &nbsp; 最新要闻</div>
      <div class="last-updated" id="lastUpdated">加载中…</div>
    </div>

    <div id="newsContainer"><div class="state-msg">加载中…</div></div>

  </div>

  <script src="assets/feature_flags.js?v=3"></script>
  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const API = "https://us-central1-baizora.cloudfunctions.net/api";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login_cn.html"; return; }
      const hEl = document.getElementById("headerEmail"); hEl.textContent = user.email[0].toUpperCase(); hEl.title = user.email;
      if (!window.FREE_ACCESS_MODE) {
        try {
          const res = await fetch(`${API}/get-user?uid=${user.uid}`);
          const data = await res.json();
          const status = data.subscriptionStatus || "inactive";
          if (status !== "active" && status !== "trialing") {
            window.location.href = "billing_cn.html"; return;
          }
        } catch(e) { /* network error — allow through */ }
      }
      loadNews();
      setInterval(loadNews, 60 * 60 * 1000);
    });

    window.doLogout = async function() {
      await signOut(auth);
      window.location.href = "index_cn.html";
    };

    async function loadNews() {
      const container = document.getElementById("newsContainer");
      try {
        // Reads the static file kept fresh by the daily news_refresh.yml GitHub Action rather
        // than calling the /api/market-news Cloud Function live — see index_cn.html's digest
        // card for the same reasoning (that CF has been bot-blocked / stuck on stale data).
        const res = await fetch("data/market_news_cn.json?t=" + Date.now());
        if (!res.ok) throw new Error("fetch failed");
        const data = await res.json();

        if (data.fetched) document.getElementById("lastUpdated").textContent = "更新时间：" + data.fetched;

        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div class="state-msg">暂无相关新闻。</div>';
          return;
        }

        container.innerHTML = data.items.map(it => {
          const suffix = " - " + it.source;
          const titleEn = it.title.endsWith(suffix) ? it.title.slice(0, -suffix.length) : it.title;
          const title = it.title_cn || titleEn;
          return `<div class="news-item">
            <div class="news-date">${it.date || ""}</div>
            <div class="news-body">
              <a class="news-title" href="${it.link}" target="_blank" rel="noopener noreferrer">${escHtml(title)}</a>
              <div class="news-source">${escHtml(it.source || "")}</div>
            </div>
          </div>`;
        }).join("");

      } catch (e) {
        container.innerHTML = '<div class="state-msg">新闻加载失败，请稍后重试。</div>';
      }
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>

</body>
