<script type="module">
  import { processSignals } from "./signalEngine.js";

  fetch("data/latest.json")
    .then(res => res.json())
    .then(data => {

      const top3 = processSignals(data, 3);

      const container = document.getElementById("preview-container");

      top3.forEach(stock => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          ${stock.ticker} — RelVol ${stock.relVol} — ${stock.change1d}%
        `;

        container.appendChild(div);
      });

    })
    .catch(err => {
      document.getElementById("preview-container").innerHTML =
        "<div class='card' style='color:red'>Failed to load signals</div>";
    });
  </script>
