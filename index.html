<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xStockEdge</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 46px;
      margin-bottom: 10px;
    }

    .tagline {
      color: #ccc;
      margin-bottom: 20px;
    }

    .section {
      margin-top: 25px;
    }

    .card {
      background: #111;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #fff;
      color: #000;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      box-sizing: border-box;
    }

    footer {
      margin-top: 40px;
      color: #aaa;
      font-size: 12px;
    }

    /* LIVE badge */
    .live-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #0f172a;
      color: #22c55e;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <h1>🚀 xStockEdge</h1>

  <div class="live-badge">
    ● LIVE SCANNING
  </div>

  <div class="tagline">
    A data-driven system that detects unusual stock activity using volume and momentum signals.
  </div>

  <div style="margin-top:10px; font-size:13px; color:#aaa;">
    Private beta for selected users
  </div>

  <!-- PREVIEW -->
  <div class="section">
    <h3>🔥 Top Live Signals</h3>
    <div id="preview-container"></div>
  </div>

  <!-- LOGIN -->
  <div class="section">
    <a href="login.html">
      <button class="btn-primary">
        Enter Live Dashboard
      </button>
    </a>
  </div>

  <!-- EMAIL -->
  <div class="section">

    <h3>Get Daily Stock Signals</h3>

    <form method="POST"
      action="https://2c286f6b.sibforms.com/serve/MUIFAAu6wnFauqXTFZ43cD3h1MSa_AhQJf9j8A5hwyQmgntMan4DzEV9-zRL1xzT1flkI0ZMoNEe99pBITTzQYXE9O3xfiWkGtHBIZ3kOzktw29dzYF2ncz2LIdowU4fgil3OhiIdUlxv9Q-Ng3SeTAzkXd4HZg07Y4Gk2EJUKviYJ9vwggHD00gtkkLpp_ZYiBHIbKgalWigeYvOQ==">

      <input type="email" name="EMAIL" required placeholder="Enter your email">

      <button class="btn-secondary" type="submit">
        Get Free Stock Alerts
      </button>

    </form>

  </div>

  <footer>
    © 2026 xStockEdge
  </footer>

</div>

<!-- SCRIPT -->
<script>
const email = localStorage.getItem("userEmail") || "";

document.getElementById("preview-container").innerHTML =
  "<div class='card'>Loading signals...</div>";

fetch(`http://127.0.0.1:8000/signals?email=${email}`)
// fetch("http://127.0.0.1:8000/signals")
  .then(res => res.json())
  .then(response => {

    console.log("Last updated:", response.timestamp);

    // const data = response.data;
    const data = response.data || [];

    const top3 = data.slice(0, 3);

    const container = document.getElementById("preview-container");
    container.innerHTML = "";

    top3.forEach(stock => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        ${stock.ticker} — RelVol ${stock.relVol} — ${stock.change1d}%
      `;

      container.appendChild(div);
    });

  })
  .catch(err => {
    document.getElementById("preview-container").innerHTML =
      "<div class='card' style='color:red'>Failed to load signals</div>";
  });
</script>

</body>
</html>
