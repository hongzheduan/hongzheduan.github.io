      --navy-mid: #0d1e3d;

    .hm-tile-ticker { font-family: 'DM Mono', monospace; color: #fff; line-height: 1.15; }

    .hm-tooltip { position: fixed; z-index: 200; pointer-events: none; background: #0d1e3d; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; max-width: 220px; }
    .hm-tooltip .hmt-ticker { font-family: 'DM Mono', monospace; font-weight: 700; color: #60a5fa; font-size: 13px; }
    .hm-tooltip .hmt-name { color: #94a3b8; font-size: 11px; margin: 2px 0 6px; }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .page { padding: 28px 16px 60px; }
    }

  <script>
// Market Heatmap — treemap sized by market cap, colored by 1D change / Baizora Score / P-E vs sector
(function() {
  const HM_NEUTRAL = [51, 65, 91];
  const HM_POS_FULL = [21, 128, 61];
  const HM_NEG_FULL = [185, 28, 28];
  const HM_CHANGE_CLAMP = 4;   // % 1D move at which tile color reaches full saturation
  const HM_VALUE_CLAMP = 100;  // % PE-vs-sector deviation at which tile color reaches full saturation

  function hmBlend(t, positive) {
    const target = positive ? HM_POS_FULL : HM_NEG_FULL;
    const r = Math.round(HM_NEUTRAL[0] + (target[0] - HM_NEUTRAL[0]) * t);
    const g = Math.round(HM_NEUTRAL[1] + (target[1] - HM_NEUTRAL[1]) * t);
    const b = Math.round(HM_NEUTRAL[2] + (target[2] - HM_NEUTRAL[2]) * t);
    return `rgb(${r},${g},${b})`;
  }
  function hmNeutralColor() { return `rgb(${HM_NEUTRAL[0]},${HM_NEUTRAL[1]},${HM_NEUTRAL[2]})`; }

  function hmColorForChange(pct) {
    const p = (pct == null) ? 0 : pct;
    const clamped = Math.max(-HM_CHANGE_CLAMP, Math.min(HM_CHANGE_CLAMP, p));
    return hmBlend(Math.abs(clamped) / HM_CHANGE_CLAMP, clamped >= 0);
  }
  function hmColorForScore(score) {
    if (score == null) return hmNeutralColor();
    const clamped = Math.max(0, Math.min(100, score));
    return hmBlend(Math.abs(clamped - 50) / 50, clamped >= 50);
  }
  function hmColorForValue(peVsSector) {
    if (peVsSector == null) return hmNeutralColor();
    const clamped = Math.max(-HM_VALUE_CLAMP, Math.min(HM_VALUE_CLAMP, peVsSector));
    return hmBlend(Math.abs(clamped) / HM_VALUE_CLAMP, clamped <= 0);
  }

  function hmWorst(row, side) {
    const sum = row.reduce((s, d) => s + d.value, 0);
    if (sum === 0) return Infinity;
    let max = -Infinity, min = Infinity;
    row.forEach(d => { if (d.value > max) max = d.value; if (d.value < min) min = d.value; });
    const s2 = side * side, sum2 = sum * sum;
    return Math.max((s2 * max) / sum2, sum2 / (s2 * min));
  }

  // Squarified treemap (Bruls, Huizing, van Wijk 2000)
  function hmSquarify(items, x, y, w, h) {
    const out = [];
    let remaining = items.filter(d => d.value > 0);
    let rx = x, ry = y, rw = w, rh = h;
    while (remaining.length) {
      const side = Math.min(rw, rh);
      let row = [remaining[0]];
      let i = 1;
      while (i < remaining.length) {
        const next = row.concat(remaining[i]);
        if (hmWorst(row, side) >= hmWorst(next, side)) { row = next; i++; }
        else break;
      }
      const rowSum = row.reduce((s, d) => s + d.value, 0);
      if (rw >= rh) {
        const rowW = rh > 0 ? rowSum / rh : 0;
        let cy = ry;
        row.forEach(d => {
          const cellH = rowSum > 0 ? (d.value / rowSum) * rh : 0;
          out.push({ data: d, x: rx, y: cy, w: rowW, h: cellH });
          cy += cellH;
        });
        rx += rowW; rw -= rowW;
      } else {
        const rowH = rw > 0 ? rowSum / rw : 0;
        let cx = rx;
        row.forEach(d => {
          const cellW = rowSum > 0 ? (d.value / rowSum) * rw : 0;
          out.push({ data: d, x: cx, y: ry, w: cellW, h: rowH });
          cx += cellW;
        });
        ry += rowH; rh -= rowH;
      }
      remaining = remaining.slice(row.length);
    }
    return out;
  }

  function hmTreemap(items, x, y, w, h) {
    const total = items.reduce((s, d) => s + d.value, 0);
    if (total <= 0 || w <= 0 || h <= 0) return [];
    const area = w * h;
    const scaled = items.slice().sort((a, b) => b.value - a.value)
      .map(d => Object.assign({}, d, { value: d.value / total * area }));
    return hmSquarify(scaled, x, y, w, h);
  }

  function hmCapLabel(cap) {
    return cap >= 1000 ? '$' + (cap / 1000).toFixed(2) + 'T' : '$' + cap.toFixed(1) + 'B';
  }

  function hmSize(cap) { return Math.sqrt(Math.max(cap, 0)); }

  let hmData = null;
  let hmMode = 'sp500';
  let hmColorMode = 'change';

  function hmTileColor(d) {
    if (hmColorMode === 'score') return hmColorForScore(d.BaizScore);
    if (hmColorMode === 'value') return hmColorForValue(d.PE_vs_Sector);
    return hmColorForChange(d.PriceChange1D);
  }

  function hmTileLabel(d) {
    if (hmColorMode === 'score') {
      return d.BaizScore == null ? '—' : Math.round(d.BaizScore).toString();
    }
    if (hmColorMode === 'value') {
      return d.PE_vs_Sector == null ? '—' : (d.PE_vs_Sector >= 0 ? '+' : '') + Math.round(d.PE_vs_Sector) + '%';
    }
    const pc = (d.PriceChange1D == null) ? 0 : d.PriceChange1D;
    return (pc >= 0 ? '+' : '') + pc.toFixed(1) + '%';
  }

  function hmBuildRows(mode) {
    if (!hmData) return [];
    const key = mode === 'sp500' ? 'InSP500' : 'InNASDAQ100';
    return hmData.filter(r => r[key] && r.MarketCap > 0 && r.Sector && r.Sector !== 'Unknown');
  }

  function hmRender(mode) {
    hmMode = mode;
    const btnSP = document.getElementById('hmBtnSP'), btnNQ = document.getElementById('hmBtnNQ');
    if (btnSP) btnSP.classList.toggle('active', mode === 'sp500');
    if (btnNQ) btnNQ.classList.toggle('active', mode === 'nasdaq');
    const wrap = document.getElementById('hmWrap');
    if (!wrap) return;
    const rows = hmBuildRows(mode);
    if (!rows.length) { wrap.innerHTML = '<div class="hm-msg">No data available</div>'; return; }

    const w = wrap.clientWidth || (wrap.parentElement && wrap.parentElement.clientWidth) || 300;
    const isMobile = window.innerWidth <= 640;
    const h = Math.round(w * (isMobile ? 1.2 : 0.58));
    wrap.style.height = h + 'px';

    const bySector = {};
    rows.forEach(r => { (bySector[r.Sector] = bySector[r.Sector] || []).push(r); });
    const sectorItems = Object.keys(bySector).map(s => ({
      name: s,
      value: bySector[s].reduce((sum, r) => sum + hmSize(r.MarketCap), 0),
      rows: bySector[s],
    }));
    const sectorRects = hmTreemap(sectorItems, 0, 0, w, h);

    let html = '';
    sectorRects.forEach(sr => {
      const HEADER = sr.h > 40 ? 18 : 0;
      html += `<div class="hm-sector" style="left:${sr.x}px;top:${sr.y}px;width:${sr.w}px;height:${sr.h}px;">`;
      if (HEADER) html += `<div class="hm-sector-label">${sr.data.name}</div>`;
      const tickerItems = sr.data.rows.map(r => Object.assign({}, r, { value: hmSize(r.MarketCap) }));
      const innerRects = hmTreemap(tickerItems, 0, 0, sr.w, Math.max(sr.h - HEADER, 1));
      innerRects.forEach(tr => {
        const d = tr.data;
        const pc = (d.PriceChange1D == null) ? 0 : d.PriceChange1D;
        const fitByWidth = tr.w / (d.Ticker.length * 0.62 + 0.6);
        const tickerFont = Math.min(14, fitByWidth, tr.h * 0.7);
        const showTicker = tickerFont >= 5.5 && tr.w >= 10 && tr.h >= 8;
        const pctFont = Math.max(0, tickerFont - 2);
        const showPct = showTicker && tr.w >= 22 && tr.h >= (tickerFont + pctFont) * 1.5;
        const hasPage = window.BaizoraChart && window.BaizoraChart.hasDedicatedPage(d.Ticker);
        html += `<a class="hm-tile${hasPage ? '' : ' bz-chart-link'}" ${hasPage ? `href="stocks/${d.Ticker}.html"` : `href="javascript:void(0)"`} style="left:${tr.x}px;top:${HEADER + tr.y}px;width:${tr.w}px;height:${tr.h}px;background:${hmTileColor(d)};" `
          + `data-ticker="${d.Ticker}" data-name="${(d.CompanyName || '').replace(/"/g, '&quot;')}" data-price="${d.Price || 0}" data-chg="${pc}" data-cap="${d.MarketCap}" data-score="${d.BaizScore == null ? '' : d.BaizScore}" data-pe="${d.PE_vs_Sector == null ? '' : d.PE_vs_Sector}">`;
        if (showTicker) {
          html += `<div class="hm-tile-ticker" style="font-size:${tickerFont.toFixed(1)}px;font-weight:500;">${d.Ticker}</div>`;
          if (showPct) html += `<div class="hm-tile-chg" style="font-size:${pctFont.toFixed(1)}px;">${hmTileLabel(d)}</div>`;
        }
        html += `</a>`;
      });
      html += `</div>`;
    });
    wrap.innerHTML = html;
  }

  window.hmSwitch = function(mode) { hmRender(mode); };

  const HM_COLOR_MODE_META = {
    change: { label: '1D price change', lo: 'Down', hi: 'Up' },
    score:  { label: 'Baizora Score (0–100 momentum composite)', lo: 'Weak', hi: 'Strong' },
    value:  { label: 'P/E vs sector average', lo: 'Pricier', hi: 'Cheaper' },
  };

  window.hmSetColorMode = function(mode) {
    hmColorMode = mode;
    const btnChange = document.getElementById('hmModeChange');
    const btnScore = document.getElementById('hmModeScore');
    const btnValue = document.getElementById('hmModeValue');
    if (btnChange) btnChange.classList.toggle('active', mode === 'change');
    if (btnScore) btnScore.classList.toggle('active', mode === 'score');
    if (btnValue) btnValue.classList.toggle('active', mode === 'value');
    const meta = HM_COLOR_MODE_META[mode];
    const colorLabel = document.getElementById('hmColorLabel');
    const lo = document.getElementById('hmLegendLo');
    const hi = document.getElementById('hmLegendHi');
    if (colorLabel && meta) colorLabel.textContent = meta.label;
    if (lo && meta) lo.textContent = meta.lo;
    if (hi && meta) hi.textContent = meta.hi;
    hmRender(hmMode);
  };

  let hmFlashTimeout = null;
  function hmFlashTile(ticker) {
    const wrap = document.getElementById('hmWrap');
    if (!wrap) return;
    wrap.querySelectorAll('.hm-tile.hm-flash').forEach(el => el.classList.remove('hm-flash'));
    let target = null;
    wrap.querySelectorAll('.hm-tile').forEach(el => { if (el.dataset.ticker === ticker) target = el; });
    if (!target) return;
    target.classList.add('hm-flash');
    target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    clearTimeout(hmFlashTimeout);
    hmFlashTimeout = setTimeout(() => target.classList.remove('hm-flash'), 1900);
  }

  function hmSearch() {
    const input = document.getElementById('hmSearchInput');
    const msg = document.getElementById('hmSearchMsg');
    if (!input || !msg) return;
    const q = input.value.trim().toUpperCase();
    msg.textContent = '';
    if (!q) return;
    if (!hmData) { msg.textContent = 'Data still loading — try again in a moment'; return; }
    const row = hmData.find(r => r.Ticker === q);
    if (!row || !row.MarketCap || row.MarketCap <= 0 || !row.Sector || row.Sector === 'Unknown') {
      msg.textContent = `"${q}" not found`;
      return;
    }
    const inCurrent = hmMode === 'sp500' ? row.InSP500 : row.InNASDAQ100;
    const inOther = hmMode === 'sp500' ? row.InNASDAQ100 : row.InSP500;
    if (!inCurrent && !inOther) {
      msg.textContent = `"${q}" is not in the S&P 500 or Nasdaq-100`;
      return;
    }
    if (!inCurrent && inOther) hmRender(hmMode === 'sp500' ? 'nasdaq' : 'sp500');
    hmFlashTile(q);
  }
  window.hmSearch = hmSearch;

  const hmSearchBtn = document.getElementById('hmSearchBtn');
  const hmSearchInput = document.getElementById('hmSearchInput');
  if (hmSearchBtn) hmSearchBtn.addEventListener('click', hmSearch);
  if (hmSearchInput) hmSearchInput.addEventListener('keydown', e => { if (e.key === 'Enter') hmSearch(); });

  const hmWrapEl = document.getElementById('hmWrap');
  if (hmWrapEl) {
    hmWrapEl.addEventListener('click', function(e) {
      const link = e.target.closest('.bz-chart-link');
      if (!link || !window.BaizoraChart) return;
      e.preventDefault();
      window.BaizoraChart.open(link.dataset.ticker, {
        name: link.dataset.name,
        price: parseFloat(link.dataset.price),
        chg: parseFloat(link.dataset.chg)
      });
    });
  }

  const hmTip = document.getElementById('hmTooltip');
  if (hmTip) {
    document.addEventListener('mouseover', function(e) {
      const t = e.target.closest && e.target.closest('.hm-tile');
      if (!t) return;
      const pc = parseFloat(t.dataset.chg);
      const cap = parseFloat(t.dataset.cap);
      const score = t.dataset.score === '' ? null : parseFloat(t.dataset.score);
      const pe = t.dataset.pe === '' ? null : parseFloat(t.dataset.pe);
      hmTip.innerHTML = `<div class="hmt-ticker">${t.dataset.ticker}</div><div class="hmt-name">${t.dataset.name}</div>`
        + `<div class="hmt-row"><span>Price</span><span>$${parseFloat(t.dataset.price).toFixed(2)}</span></div>`
        + `<div class="hmt-row"><span>1D Chg</span><span style="color:${pc >= 0 ? '#22c55e' : '#ef4444'}">${pc >= 0 ? '+' : ''}${pc.toFixed(2)}%</span></div>`
        + `<div class="hmt-row"><span>Baizora Score</span><span style="color:${score == null ? '#64748b' : (score >= 50 ? '#22c55e' : '#ef4444')}">${score == null ? '—' : Math.round(score)}</span></div>`
        + `<div class="hmt-row"><span>P/E vs Sector</span><span style="color:${pe == null ? '#64748b' : (pe <= 0 ? '#22c55e' : '#ef4444')}">${pe == null ? '—' : (pe >= 0 ? '+' : '') + Math.round(pe) + '%'}</span></div>`
        + `<div class="hmt-row"><span>Market Cap</span><span>${hmCapLabel(cap)}</span></div>`;
      hmTip.style.display = 'block';
    });
    document.addEventListener('mousemove', function(e) {
      if (hmTip.style.display !== 'block') return;
      const pad = 14;
      let left = e.clientX + pad, top = e.clientY + pad;
      if (left + 220 > window.innerWidth) left = e.clientX - 220 - pad;
      if (top + 110 > window.innerHeight) top = e.clientY - 110 - pad;
      hmTip.style.left = left + 'px'; hmTip.style.top = top + 'px';
    });
    document.addEventListener('mouseout', function(e) {
      const t = e.target.closest && e.target.closest('.hm-tile');
      if (t && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.hm-tile'))) {
        hmTip.style.display = 'none';
      }
    });
  }

  fetch('data/latest.json').then(r => r.json()).then(d => {
    hmData = d.data;
    hmRender('sp500');
    const dateEl = document.getElementById('hmDataDate');
    if (dateEl && d.date) dateEl.textContent = 'Data as of ' + d.date;
  }).catch(() => {
    const wrap = document.getElementById('hmWrap');
    if (wrap) wrap.innerHTML = '<div class="hm-msg">Unable to load heatmap data</div>';
  });

  let hmResizeT;
  window.addEventListener('resize', function() {
    clearTimeout(hmResizeT);
    hmResizeT = setTimeout(() => hmRender(hmMode), 200);
  });
})();
  </script>

</body>
</html>
