  <style>
    :root {
      --navy: #060d1f;
      --navy-mid: #0d1e3d;
      --navy-light: #162847;
      --electric: #3b82f6;
      --electric-bright: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fcd34d;

      --red: #ef4444;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
    }

    body::before {
      content: '';

      inset: 0;
      background-image:

        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: rgba(6,13,31,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 12px;
    }

      gap: 10px;
      text-decoration: none;

    }

    .logo-wrap img { height: 36px; }

    .brand-cn {

      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(90deg, var(--white), var(--electric-bright));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-email {
      display: inline-flex;

      font-weight: 700;

      justify-content: center;
      flex-shrink: 0;
      cursor: default;
    }

    .nav-btn {

      background: transparent;
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;

    .nav-btn:hover { border-color: rgba(59,130,246,0.4); color: var(--white); background: rgba(59,130,246,0.08); }
    .nav-btn-danger { border-color: rgba(239,68,68,0.2); color: #fca5a5; }
    .nav-btn-danger:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.4); }

    .page {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .page-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--electric-bright);

    .page-title {

      font-size: clamp(26px, 4vw, 36px);

    }

    .page-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    /* info banner */
    .info-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(251,146,60,0.08);
      border: 1px solid rgba(251,146,60,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 32px;
      font-size: 13px;
      color: #fdba74;
      line-height: 1.5;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;

    }

    .last-updated {
      font-family: 'DM Mono', monospace;
      font-size: 11px;

    }

    /* category tab buttons */
    .cat-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;

    .cat-tab {
      font-family: 'DM Mono', monospace;

      padding: 6px 14px;

      cursor: pointer;

    .cat-tab.active-add { background: rgba(34,197,94,0.1);  border-color: rgba(34,197,94,0.35);  color: #86efac; }
    .cat-tab.active-rem { background: rgba(239,68,68,0.1);  border-color: rgba(239,68,68,0.35);  color: #fca5a5; }

    .cat-count {

<body>

  <header>
    <a href="./" class="logo-wrap">
      <span class="brand-cn">贝佐拉</span>
    </a>
    <div class="header-right">
      <span class="user-email" id="headerEmail"></span>
      <a href="dashboard_cn.html" class="nav-btn">个人主页</a>
      <button class="nav-btn nav-btn-danger" onclick="doLogout()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出登录
      </button>
    </div>
  </header>

  <div class="page">

    <div class="page-eyebrow">◈ &nbsp; 指数资讯</div>
    <h1 class="page-title">指数成分动态</h1>
    <p class="page-sub">标普500与纳斯达克100的近期及预告成分股增减变动，来源于金融新闻媒体，每日更新。</p>

    <div class="info-banner">
      新闻通过 Google News RSS 抓取，可能包含预告文章与事后回顾报道。点击标题可跳转至原文来源。
    </div>

    <div class="meta-row">
      <div class="section-label">◈ &nbsp; 近90天</div>
      <div class="last-updated" id="lastUpdated">加载中…</div>
    </div>

    <div class="cat-tabs" id="catTabs"></div>
    <div class="cat-count" id="catCount"></div>
    <div id="newsContainer"><div class="state-msg">加载中…</div></div>

  </div>

  <script src="assets/feature_flags.js?v=3"></script>
  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const API = "https://us-central1-baizora.cloudfunctions.net/api";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login_cn.html"; return; }
      const hEl = document.getElementById("headerEmail"); hEl.textContent = user.email[0].toUpperCase(); hEl.title = user.email;
      if (!window.FREE_ACCESS_MODE) {
        try {
          const res = await fetch(`${API}/get-user?uid=${user.uid}`);
          const data = await res.json();
          const status = data.subscriptionStatus || "inactive";
          if (status !== "active" && status !== "trialing") {
            window.location.href = "billing_cn.html"; return;
          }
        } catch(e) { /* network error — allow through */ }
      }
      loadNews();
      setInterval(loadNews, 60 * 60 * 1000);
    });

    window.doLogout = async function() {
      await signOut(auth);
      window.location.href = "index_cn.html";
    };

    const CATEGORIES = [
      { key: "S&P 500 addition",    label: "S&P 500 — 新加入",       cls: "active-add" },
      { key: "S&P 500 removal",     label: "S&P 500 — 移除",         cls: "active-rem" },
      { key: "Nasdaq-100 addition", label: "NASDAQ-100 — 新加入",    cls: "active-add" },
      { key: "Nasdaq-100 removal",  label: "NASDAQ-100 — 移除",      cls: "active-rem" },
    ];

    let allItems = [];
    let activeKey = CATEGORIES[0].key;

    async function loadNews() {
      const container = document.getElementById("newsContainer");
      try {
        // Reads the static file kept fresh by the daily news_refresh.yml GitHub Action rather
        // than calling the /index-news Cloud Function live — that CF does several sequential
        // RSS fetches plus a per-item translation loop on every cache miss, which showed up as
        // a multi-second wait on every page load.
        const res = await fetch("data/index_news.json?t=" + Date.now());
        if (!res.ok) throw new Error("fetch failed");
        let data = await res.json();

        const _now = new Date();
        const _checked = _now.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }) + ' ' + _now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York', hour12: false }) + ' ET';
        document.getElementById("lastUpdated").textContent = "检查时间：" + _checked;

        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div class="state-msg">近90天暂无相关新闻。</div>';
          return;
        }

        allItems = data.items;
        buildTabs();
        renderCategory(activeKey);

      } catch (e) {
        container.innerHTML = '<div class="state-msg">新闻加载失败，请稍后重试。</div>';
      }
    }

    function buildTabs() {
      const tabsEl = document.getElementById("catTabs");
      tabsEl.innerHTML = CATEGORIES.map(cat => {
        const count = allItems.filter(it => it.category === cat.key).length;
        return `<button class="cat-tab" data-key="${cat.key}" data-cls="${cat.cls}" onclick="selectTab('${cat.key}')">${cat.label} (${count})</button>`;
      }).join("");
      document.querySelector(`.cat-tab[data-key="${activeKey}"]`)?.classList.add(CATEGORIES.find(c => c.key === activeKey).cls);
    }

    window.selectTab = function(key) {
      activeKey = key;
      document.querySelectorAll(".cat-tab").forEach(btn => {
        btn.classList.remove("active-add", "active-rem");
        if (btn.dataset.key === key) btn.classList.add(btn.dataset.cls);
      });
      renderCategory(key);
    };

    function renderCategory(key) {
      const container = document.getElementById("newsContainer");
      const countEl   = document.getElementById("catCount");
      const items = allItems.filter(it => it.category === key);

      if (items.length === 0) {
        countEl.textContent = "";
        container.innerHTML = '<div class="state-msg">该分类暂无相关新闻。</div>';
        return;
      }

      countEl.textContent = items.length + " 篇";

      container.innerHTML = items.map(it => {
        const suffix = " - " + it.source;
        const titleEn = it.title.endsWith(suffix) ? it.title.slice(0, -suffix.length) : it.title;
        const title = it.title_cn || titleEn;
        return `<div class="news-item">
          <div class="news-date">${it.date}</div>
          <div class="news-body">
            <a class="news-title" href="${it.link}" target="_blank" rel="noopener noreferrer">${escHtml(title)}</a>
            <div class="news-source">${escHtml(it.source)}</div>
          </div>
        </div>`;
      }).join("");
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
