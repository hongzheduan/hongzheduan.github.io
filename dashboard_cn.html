<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baizora | 控制台</title>
  <link rel="icon" href="assets/baize_favicon_v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #060d1f;
      --navy-mid: #0d1e3d;
      --electric: #3b82f6;
      --electric-bright: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --green: #22c55e;
      --white: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: rgba(6,13,31,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .header-left img { height: 32px; }

    .brand-cn {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(90deg, var(--white), var(--electric-bright));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--white);
      letter-spacing: -0.02em;
    }

    .logo-text span { color: var(--electric); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-email {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .nav-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-btn:hover { border-color: rgba(59,130,246,0.4); color: var(--white); background: rgba(59,130,246,0.08); }
    .nav-btn-danger { border-color: rgba(239,68,68,0.2); color: #fca5a5; }
    .nav-btn-danger:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.4); }

    /* hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 5px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
    }

    .hamburger span { display: block; width: 18px; height: 2px; background: var(--muted); border-radius: 2px; }

    .mobile-drawer {
      display: none;
      position: fixed;
      left: 0; right: 0;
      z-index: 99;
      background: rgba(6,13,31,0.98);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      padding: 12px 20px 20px;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-drawer.open { display: flex; }

    .mobile-drawer a, .mobile-drawer button {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      background: transparent;
      border: 1px solid var(--border);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mobile-drawer a:hover, .mobile-drawer button:hover { background: rgba(59,130,246,0.08); color: var(--white); }
    .mobile-drawer .m-danger { border-color: rgba(239,68,68,0.2); color: #fca5a5; }

    /* ── PAGE ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .page-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--electric-bright);
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 6px;
    }

    .page-sub {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 300;
      margin-bottom: 40px;
    }

    /* ── STATUS PILL ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-bottom: 40px;
    }

    .status-pill.active   { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.25);  color: #86efac; }
    .status-pill.trialing { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); color: var(--gold-light); }
    .status-pill.inactive { background: rgba(148,163,184,0.1);border: 1px solid rgba(148,163,184,0.2); color: var(--muted); }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-pill.active   .status-dot { background: #22c55e; animation: pulse 2s ease infinite; }
    .status-pill.trialing .status-dot { background: var(--gold); animation: pulse 2s ease infinite; }
    .status-pill.inactive .status-dot { background: var(--muted); }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ── SECTION ── */
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── TOOL CARDS GRID ── */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 40px;
    }

    .tool-card {
      background: rgba(13,30,61,0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-decoration: none;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.35), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .tool-card:hover { border-color: rgba(59,130,246,0.3); background: rgba(13,30,61,0.9); transform: translateY(-2px); box-shadow: 0 16px 48px rgba(0,0,0,0.3); }
    .tool-card:hover::before { opacity: 1; }

    .tool-card.gold-border { border-color: rgba(245,158,11,0.2); }
    .tool-card.gold-border:hover { border-color: rgba(245,158,11,0.4); }
    .tool-card.gold-border::before { background: linear-gradient(90deg, transparent, rgba(245,158,11,0.3), transparent); }

    .tool-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .tool-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .tool-icon.gold-icon {
      background: rgba(245,158,11,0.1);
      border-color: rgba(245,158,11,0.2);
    }

    .tool-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
    }

    .tool-desc {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 400;
      line-height: 1.6;
    }

    .tool-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      margin-top: auto;
      align-self: flex-start;
    }

    .tag-live    { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.2);  color: #86efac; }
    .tag-soon    { background: rgba(148,163,184,0.1);border: 1px solid rgba(148,163,184,0.25);color: #94a3b8; }
    .tag-account { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); color: #60a5fa; }
    .tag-free    { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.2); color: var(--gold-light); }

    /* ── ACCOUNT QUICK LINKS ── */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 40px;
    }

    .quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(13,30,61,0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      transition: all 0.2s;
    }

    .quick-link:hover { background: rgba(59,130,246,0.08); color: var(--white); border-color: rgba(59,130,246,0.3); }
    .quick-link-icon { font-size: 16px; }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .header-right .nav-btn, .user-email { display: none; }
      .hamburger { display: flex; }
      .page { padding: 28px 16px 60px; }
      .tools-grid { grid-template-columns: 1fr; }
      .quick-links { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="./" class="header-left">
      <img src="assets/baize_favicon_v2.png" alt="Baizora">
      <span class="brand-cn">贝佐拉</span>
    </a>
    <div class="header-right">
      <span class="user-email" id="headerEmail"></span>
      <!-- <a href="account_cn.html" class="nav-btn">我的账户</a> -->
      <button class="nav-btn nav-btn-danger" onclick="doLogout()">↪ 退出登录</button>
    </div>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Mobile drawer -->
  <div class="mobile-drawer" id="mobileDrawer">
    <!-- <a href="account_cn.html">我的账户</a> -->
    <!-- <a href="billing_cn.html">订阅方案</a> -->
    <button class="m-danger" onclick="doLogout()">↪ 退出登录</button>
  </div>

  <!-- Page -->
  <div class="page">

    <!-- <div class="page-eyebrow">◈ &nbsp; 控制台</div> -->
    <h1 class="page-title">欢迎回家<span id="nameGreeting"></span></h1>
    <p class="page-sub">贝佐拉正在持续为您扫描量价异动...</p>

    <!-- Subscription status pill -->
    <div class="status-pill inactive" id="statusPill" style="display:none;">
      <span class="status-dot"></span>
      <span id="statusText">Loading…</span>
    </div>

    <!-- ── TOOLS ── -->
    <div class="section-label">工具</div>
    <div class="tools-grid">

      <a href="baizora_main_form.html" class="tool-card">
        <div class="tool-icon">◎</div>
        <div class="tool-name">量价扫描仪</div>
        <div class="tool-desc">标普500和纳斯达克100每日信号。在当日和每个时间周期都可按价格变动、成交量等自由排序。</div>
        <div class="tool-tag tag-live">● 上线中</div>
      </a>

      <a href="free_cn.html" class="tool-card">
        <div class="tool-icon">⬡</div>
        <div class="tool-name">免费预览</div>
        <div class="tool-desc">今日股价涨幅最大前3只异动股 — 无需登录，可分享给任何人。</div>
        <div class="tool-tag tag-free">免费</div>
      </a>

      <div class="tool-card locked">
        <div class="tool-icon">⟁</div>
        <div class="tool-name">行业热力图</div>
        <div class="tool-desc">按行业分类展示每日价格与成交量异动，直观可视化。</div>
        <div class="tool-tag tag-soon">即将上线</div>
      </div>

      <div class="tool-card locked">
        <div class="tool-icon">◷</div>
        <div class="tool-name">信号历史</div>
        <div class="tool-desc">浏览历史每日快照，查看任意股票信号随时间的变化轨迹。</div>
        <div class="tool-tag tag-soon">即将上线</div>
      </div>

    </div>

    <!-- ── ACCOUNT ── -->
    <div class="section-label">我的账户</div>
    <div class="quick-links">
      <a href="account_cn.html" class="quick-link">
        <span class="quick-link-icon">👤</span> 我的账户
      </a>
      <a href="billing_cn.html" class="quick-link">
        <span class="quick-link-icon">💳</span> 订阅方案
      </a>
      <a href="index_cn.html" class="quick-link">
        <span class="quick-link-icon">🏠</span> 首页
      </a>
      <a href="free_cn.html" class="quick-link">
        <span class="quick-link-icon">👁</span> 免费预览
      </a>
      <a href="assets/faq_cn.html" class="quick-link">
        <span class="quick-link-icon">❓</span> 常见问题
      </a>
      <a href="mailto:support@baizora.com" class="quick-link">
        <span class="quick-link-icon">✉️</span> 联系客服
      </a>
    </div>

  </div><!-- /page -->

  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const API = "https://us-central1-baizora.cloudfunctions.net/api";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login_cn.html";
        return;
      }

      // Fill header email
      document.getElementById("headerEmail").textContent = user.email;

      // Greeting
      const name = user.email.split("@")[0];
      document.getElementById("nameGreeting").textContent = ", " + name;

      // Fetch subscription status
      const pill = document.getElementById("statusPill");
      const text = document.getElementById("statusText");
      pill.style.display = "inline-flex";

      try {
        const res  = await fetch(`${API}/get-user?uid=${user.uid}`);
        const data = await res.json();
        const status = data.subscriptionStatus || "inactive";

        pill.className = `status-pill ${status}`;

        if (status === "active") {
          text.textContent = "订阅已激活";
        } else if (status === "trialing") {
          const end = data.currentPeriodEnd
            ? " · 试用结束期： " + new Date(data.currentPeriodEnd * 1000).toLocaleDateString("zh-CN", { month: "short", day: "numeric", year: "numeric" })
            : "";
          text.textContent = "免费试用中" + end;
        } else {
          text.textContent = "暂无有效订阅";
          // Lock scanner card and show upgrade prompt
          const scannerCard = document.querySelector('a[href="baizora_main_form.html"]');
          if (scannerCard) {
            scannerCard.classList.add("locked");
            scannerCard.removeAttribute("href");
            const tag = scannerCard.querySelector('.tool-tag');
            if (tag) { tag.className = 'tool-tag tag-soon'; tag.textContent = '→ Please choose a plan to view'; }
          }
        }
      } catch(e) {
        console.warn("订阅状态获取失败：", e.message);
        pill.style.display = "none";
      }
    });

    window.doLogout = async function() {
      await signOut(auth);
      window.location.href = "login_cn.html";
    };

    /* Mobile menu */
    window.toggleMenu = function() {
      const drawer = document.getElementById("mobileDrawer");
      const header = document.querySelector("header");
      drawer.style.top = header.getBoundingClientRect().bottom + "px";
      drawer.classList.toggle("open");
    };

    document.addEventListener("click", (e) => {
      const drawer = document.getElementById("mobileDrawer");
      const btn    = document.getElementById("hamburger");
      if (drawer.classList.contains("open") && !drawer.contains(e.target) && !btn.contains(e.target)) {
        drawer.classList.remove("open");
      }
    });
  </script>

</body>
</html>
