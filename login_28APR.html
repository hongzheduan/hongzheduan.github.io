<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Baizora</title>
</head>
<body style="background:black; color:white; text-align:center; padding:100px; font-family:Arial;">

  <h1>Login</h1>

  <input id="email" placeholder="Enter email" style="padding:10px; width:250px;"><br><br>

  <button onclick="login()" style="padding:10px 20px;">Continue</button>

  <script>
    function login() {
      const email = document.getElementById("email").value;

      // if (email) {
      //   localStorage.setItem("loggedIn", "true");
      //   window.location.href = "dashboard.html";
      // }

      if (email) {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userEmail", email);

        // 🆕 SIMPLE TIER LOGIC
        let tier = "free";

        if (email.includes("premium") || email.includes("pro")) {
          tier = "premium";
        }

        localStorage.setItem("userTier", tier);

        window.location.href = "dashboard.html";

      }
    }
  </script>

</body>
</html>
