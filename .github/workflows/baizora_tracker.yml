name: Baizora Tracker

# SPI Tracker: own 25/75 list in data/spi_tracker.json (spi_tracker.py, 2026-10-24).
# Records each finished session's top-10 list (RS + Momentum conviction since 2026-10-24; its 21-session
# RSMom history is kept in data/baizora_tracker_trail.json) into
# data/baizora_tracker.json (baizora_tracker.py), shown on baizora_tracker.html, and the
# SPG Tracker list into data/spg_tracker.json (spg_tracker.py, added 2026-10-23), and the SB Tracker
# product-launch list with 6-day exits into data/sb_tracker.json (sb_tracker.py, added 2026-10-23;
# headlines from fetch_product_news.py -> data/product_news.json, fetched once, restored after each reset).
# Custom Tracker: SB's rule with 21-day exits into data/custom_tracker.json (custom_tracker.py, 2026-10-25).
# SPG switched to top 10 by 3-month change (2026-10-28); its old 5-up-days rule moved to sg_tracker.py -> data/sg_tracker.json.
# Also refreshes data/se_tracker_prices.json (se_tracker_prices.py, added 2026-10-24): SE Tracker's
# close on each index-change day and one month later.
# Added 2026-10-21. Runs after the scanner's evening scans; the script is idempotent
# (skips midday snapshots and dates already logged), so the later crons are just
# retries for a late or dropped scan.

on:
  schedule:
    # Fixed UTC (ET shifts an hour with DST) plus GitHub's ~40-90 min dispatch delay.
    - cron: "45 23 * * 1-5"   # 7:45 PM EDT, after the 6:30 PM final scan
    - cron: "15 2 * * 2-6"    # 10:15 PM EDT retry
    - cron: "30 6 * * 2-6"    # 2:30 AM EDT retry, after the ~midnight scanner safety-net run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baizora-tracker
  cancel-in-progress: false

jobs:
  record-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch product-launch headlines (SB Tracker)
        run: |
          python3 fetch_product_news.py || echo "product news fetch failed; SB uses the headlines on file"
          cp data/product_news.json "$RUNNER_TEMP/product_news.json"

      - name: Record today's list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/product_news.json" data/product_news.json
            python3 baizora_tracker.py
            python3 spg_tracker.py
            python3 sg_tracker.py
            python3 spi_tracker.py
            python3 sb_tracker.py
            python3 custom_tracker.py
            python3 se_tracker_prices.py || echo "SE tracker prices failed; keeping the file on disk"
            git add data/baizora_tracker.json data/baizora_tracker_trail.json data/spi_tracker.json data/spg_tracker.json data/sg_tracker.json data/sb_tracker.json data/custom_tracker.json data/product_news.json data/se_tracker_prices.json
            if git diff --cached --quiet; then echo "No new list"; exit 0; fi
            git commit -m "auto update trackers $(python3 -c "import json; print(json.load(open('data/latest.json'))['date'])")"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1
