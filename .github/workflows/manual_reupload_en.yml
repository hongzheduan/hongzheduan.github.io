name: Manual — Re-upload EN video to @baizorastock

# One-off catch-up: baizora-en3 got an EN category video upload yesterday
# (commit b2ccce9) before that split was reverted (commit range e3ab1a9..c4414da).
# This re-uploads the same already-committed local file to the default channel
# (YOUTUBE_REFRESH_TOKEN, now @baizorastock again) and repoints the homepage
# link, mirroring b2ccce9's pattern in reverse. Delete this workflow file after
# the one run it's needed for.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reupload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install video dependencies
        run: pip install -r video/requirements.txt

      - name: Re-upload to @baizorastock
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          OUT=$(python video/upload_youtube.py --file data/latest_video_en.mp4 --type index_spotlight --date 2026-07-17)
          echo "$OUT"
          YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
          if [ -z "$YT_URL" ]; then
            echo "Upload failed, no URL captured"
            exit 1
          fi
          echo "YT_URL=$YT_URL" >> $GITHUB_ENV

      - name: Update homepage meta and commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main
          python -c "import json,sys; m=json.load(open('data/latest_video_meta.json')); m['en']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_meta.json','w'))" "$YT_URL"
          git add data/latest_video_meta.json
          git commit -m "data: point EN category video link at @baizorastock re-upload"
          git push origin HEAD:main
