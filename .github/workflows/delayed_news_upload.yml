name: Delayed News Video Upload

# scanner.yml's weekday 4:30 PM ET run ("30 20 * * 1-5") generates and commits
# both languages' "Market Pulse" news videos but deliberately does NOT upload
# them to YouTube (NEWS_UPLOAD_NOW=False there) — they're uploaded here
# instead, ~12 hours later, so they don't post at the same moment as the
# category videos. Weekend news runs are unaffected: those upload both
# languages immediately in scanner.yml itself and never have anything
# pending for this workflow to pick up.
#
# data/latest_video_news_meta.json (what the homepage reads) is only ever
# written at actual upload time — the weekday generation step deliberately
# leaves it alone, so the homepage keeps showing yesterday's real, working
# video/link the whole 12h gap instead of going blank. What's actually
# waiting to be uploaded is tracked separately in
# data/latest_video_news_pending.json (written by the generation step,
# cleared per-language here once its upload succeeds).

on:
  schedule:
    - cron: "30 8 * * 2-6"   # ~4:30 AM ET, the morning after each weekday run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upload-delayed-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install video dependencies
        run: pip install -r video/requirements.txt

      - name: Upload pending news videos to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_CN_REFRESH_TOKEN }}
        run: |
          UPLOADED=0

          # CN goes to the separate @baizorastock_CN channel (same OAuth
          # client, its own refresh token); EN stays on the main channel.
          for pair in "en:data/latest_video_news_en.mp4:$YOUTUBE_REFRESH_TOKEN:news_report" "cn:data/latest_video_news_cn.mp4:$YOUTUBE_CN_REFRESH_TOKEN:news_report_cn"; do
            IFS=':' read -r LANGKEY FILE TOKEN TYPE <<< "$pair"

            PENDING_DATE=$(LANGKEY="$LANGKEY" python -c "
          import json, os
          try:
              p = json.load(open('data/latest_video_news_pending.json'))
          except Exception:
              p = {}
          entry = p.get(os.environ['LANGKEY'])
          print(entry['date'] if entry else '')
          ")

            if [ -z "$PENDING_DATE" ]; then
              echo "No pending $LANGKEY news video — nothing to do"
              continue
            fi
            if [ ! -f "$FILE" ]; then
              echo "Pending $LANGKEY news video listed but $FILE is missing — skipping"
              continue
            fi

            OUT=$(YOUTUBE_REFRESH_TOKEN="$TOKEN" python video/upload_youtube.py --file "$FILE" --type "$TYPE" --date "$PENDING_DATE")
            echo "$OUT"
            YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
            if [ -n "$YT_URL" ]; then
              LANGKEY="$LANGKEY" YT_URL="$YT_URL" PENDING_DATE="$PENDING_DATE" python -c "
          import json, os

          try:
              meta = json.load(open('data/latest_video_news_meta.json'))
          except Exception:
              meta = {}
          try:
              pending = json.load(open('data/latest_video_news_pending.json'))
          except Exception:
              pending = {}

          lang = os.environ['LANGKEY']
          name = pending.get(lang, {}).get('name', '')
          meta[lang] = {'name': name, 'date': os.environ['PENDING_DATE'], 'url': os.environ['YT_URL']}
          pending.pop(lang, None)

          json.dump(meta, open('data/latest_video_news_meta.json', 'w'))
          json.dump(pending, open('data/latest_video_news_pending.json', 'w'))
          "
              UPLOADED=1
            fi
          done

          echo "UPLOADED=$UPLOADED" >> $GITHUB_ENV

      - name: Commit updated news video URLs
        if: env.UPLOADED == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add data/latest_video_news_meta.json data/latest_video_news_pending.json
          git commit -m "auto: upload deferred news video(s) $(date -u)"
          git push origin HEAD:main
