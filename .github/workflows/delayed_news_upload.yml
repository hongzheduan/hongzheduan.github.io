name: Delayed News Video Upload

# scanner.yml's weekday 4:30 PM ET run ("30 20 * * 1-5") generates and commits
# both languages' "Market Pulse" news videos but deliberately does NOT upload
# them to YouTube (NEWS_UPLOAD_NOW=False there) — they're uploaded here
# instead, ~12 hours later, so they don't post at the same moment as the
# category videos. Weekend news runs are unaffected: those upload both
# languages immediately in scanner.yml itself and never have anything
# pending for this workflow to pick up.

on:
  schedule:
    - cron: "30 8 * * 2-6"   # ~4:30 AM ET, the morning after each weekday run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upload-delayed-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install video dependencies
        run: pip install -r video/requirements.txt

      - name: Upload pending news videos to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_CN_REFRESH_TOKEN }}
        run: |
          UPLOADED=0

          # "Pending" means the last committed meta entry for that language has
          # a name (a video was generated) but no url yet (scanner.yml
          # deliberately skipped uploading it). If url is already set, either
          # the weekend path uploaded it directly or this workflow already ran
          # for it — skip so a re-run (e.g. a manual workflow_dispatch) can't
          # double-post. CN goes to the separate @baizorastock_CN channel (same
          # OAuth client, its own refresh token); EN stays on the main channel.
          for pair in "en:data/latest_video_news_en.mp4:$YOUTUBE_REFRESH_TOKEN:news_report" "cn:data/latest_video_news_cn.mp4:$YOUTUBE_CN_REFRESH_TOKEN:news_report_cn"; do
            IFS=':' read -r LANGKEY FILE TOKEN TYPE <<< "$pair"

            if [ ! -f "$FILE" ]; then
              echo "No $LANGKEY news video committed — nothing to upload"
              continue
            fi

            PENDING=$(LANGKEY="$LANGKEY" python -c "
          import json, os
          try:
              m = json.load(open('data/latest_video_news_meta.json'))
          except Exception:
              m = {}
          entry = m.get(os.environ['LANGKEY'], {})
          print('yes' if entry.get('name') and not entry.get('url') else 'no')
          ")

            if [ "$PENDING" != "yes" ]; then
              echo "No pending $LANGKEY news video (already uploaded, or none generated) — nothing to do"
              continue
            fi

            NEWS_DATE=$(LANGKEY="$LANGKEY" python -c "import json,os; print(json.load(open('data/latest_video_news_meta.json'))[os.environ['LANGKEY']]['date'])")
            OUT=$(YOUTUBE_REFRESH_TOKEN="$TOKEN" python video/upload_youtube.py --file "$FILE" --type "$TYPE" --date "$NEWS_DATE")
            echo "$OUT"
            YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
            if [ -n "$YT_URL" ]; then
              python -c "import json,sys,os; m=json.load(open('data/latest_video_news_meta.json')); m[os.environ['LANGKEY']]['url']=sys.argv[1]; json.dump(m,open('data/latest_video_news_meta.json','w'))" "$YT_URL"
              UPLOADED=1
            fi
          done

          echo "UPLOADED=$UPLOADED" >> $GITHUB_ENV

      - name: Commit updated news video URLs
        if: env.UPLOADED == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add data/latest_video_news_meta.json
          git commit -m "auto: upload deferred news video(s) $(date -u)"
          git push origin HEAD:main
