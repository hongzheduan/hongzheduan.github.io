name: Baizora Scanner

on:
  schedule:
    - cron: "0 17 * * *"      # 1:00 PM ET every day — news report video only, decoupled from the
                               # scan/category-video timing (doesn't need market data, and its own
                               # generation step alone takes ~30 min — see worklog delay pattern
                               # below, actual fire is typically ~70-90 min late, landing ~2:15-2:30 PM ET)
    - cron: "30 19 * * *"     # 3:30 PM ET every day — news video retry, in case the 1:00 PM ET run's
                               # job never got picked up by a GitHub-hosted runner (happened
                               # 2026-08-06 — "not acquired by Runner ... after multiple attempts",
                               # a GitHub infra flake, not a code bug; there's no other retry for the
                               # news video since it doesn't depend on market-data availability like
                               # the scan retries below do). No-ops per language if that language's
                               # video already shows today's date in latest_video_news_meta.json.
    - cron: "30 20 * * 1-5"   # 4:30 PM ET weekdays  — preliminary data + category video (retries at 5:00 PM)
    - cron: "0 21 * * 1-5"    # 5:00 PM ET weekdays  — retry if 4:30 PM data not yet available (actual ~7:00 PM ET); no EDGAR
    - cron: "30 21 * * 1-5"   # 5:30 PM ET weekdays  — retry if 4:30 PM data not yet available
    - cron: "30 22 * * 1-5"   # 6:30 PM ET weekdays  — final data
    - cron: "0 4 * * 2-6"    # ~midnight ET weekdays (11 PM ET only under EST/winter — this UTC
                               # time is fixed and doesn't shift with DST, so during EDT/summer
                               # it lands an hour later than "11 PM" — plus the usual ~40-90 min
                               # GH Actions schedule-dispatch delay on top) — full EDGAR + market
                               # scan, no videos. Also the yfinance-mode safety-net: recovers a
                               # day whose 4:30 PM ET scan GitHub silently dropped (no-ops via
                               # SKIP_IF_COMPLETE when latest.json is already current).
    - cron: "0 5 * * 0,6"    # 1 AM ET weekends (midnight ET only under EST/winter — same fixed-UTC
                               # DST drift as above) — EDGAR refresh only
    - cron: "0 14 * * 0,6"   # 10:00 AM ET weekends — category video only, no market scan (news report
                               # video moved to the dedicated 1:00 PM ET slot above); moved earlier from
                               # 4:00 PM ET 2026-08-02 so weekend viewers have the whole day to watch
                               # (nominal 10 AM ET — actual fire is typically ~70-90 min late per the
                               # GH Actions delay pattern noted above, so real landing is closer to ~11:30 AM ET)
  workflow_dispatch:
    inputs:
      run_videos:
        description: "Also generate today's category Short + news report videos (normally skipped on manual runs)"
        type: boolean
        default: false
      weekend_mode:
        description: "Replicate the weekend cron (skip market scan, reuse committed data/latest.json)"
        type: boolean
        default: false
      news_only:
        description: "With run_videos=true, skip category video generation/upload entirely and only run the news report video (e.g. catching up after category video already published separately)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Cost-cutting switch (no paying customers yet, 2026-08): "yfinance" sources daily
  # price/volume (and the SPY benchmark, BRK-A price, company-name meta) from free
  # yfinance instead of paid Tiingo — see scanner_tiingo.py's OHLCV_SOURCE flag.
  # Fundamentals (EPS/shares/sector) still come from free SEC EDGAR either way,
  # unaffected. Flip to "tiingo" (needs an active Tiingo subscription + secret again)
  # once there's revenue to justify it. See also assets/feature_flags.js for the
  # matching live-intraday-price switch.
  OHLCV_SOURCE_SWITCH: "yfinance"

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check market holiday and run type
        run: |
          IS_HOLIDAY=$(python -c "from scanner_tiingo import is_market_holiday; print(is_market_holiday())")
          echo "IS_HOLIDAY=$IS_HOLIDAY" >> $GITHUB_ENV

          SCHEDULE="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"

          # midnight ET cron → EDGAR-only refresh, skip market scan
          if [ "$SCHEDULE" = "0 5 * * 0,6" ]; then
            echo "EDGAR_ONLY=1"    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "0 17 * * *" ]; then
            # 1:00 PM ET every day — news report video only, decoupled from category
            # video/scan timing since it doesn't need market data and its own generation
            # step alone takes ~30 min (news content comes from data/market_news*.json,
            # refreshed daily around noon ET by the separate news_refresh.py workflow —
            # a 1 PM ET snapshot is an accepted tradeoff, not the freshest possible at close).
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "SKIP_SCAN=1"    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=True"  >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "30 19 * * *" ]; then
            # 3:30 PM ET every day — news video retry (see cron comment above). Same
            # env as the 1:00 PM ET run; the per-language "already done today" guard
            # lives in the "Generate news report videos" step itself.
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "SKIP_SCAN=1"    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=True"  >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "0 14 * * 0,6" ]; then
            # 10:00 AM ET weekends — category video only (Saturday: Worst Performer,
            # Sunday: Highest Average Volume). No market scan needed (reuses Friday's
            # already-committed data/latest.json + data/candles.json). News report
            # video moved to the dedicated 1:00 PM ET slot above.
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "SKIP_SCAN=1"    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=True" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=False"  >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "0 4 * * 2-6" ]; then
            # ~midnight ET weekdays — full EDGAR + market scan, no videos. In yfinance
            # mode this is the safety-net that recovers a day whose 4:30 PM ET scan was
            # dropped by GitHub's scheduler (see the trailing exclusion block below):
            # SKIP_IF_COMPLETE makes it a fast no-op when latest.json is already current,
            # and a full scan only when the afternoon run really was missed.
            echo "FORCE_RUN=1"    >> $GITHUB_ENV
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
            echo "SKIP_IF_COMPLETE=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "30 20 * * 1-5" ]; then
            # News report video moved to the dedicated 1:00 PM ET slot above.
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV   # run EDGAR (~6:30 PM ET actual, after 5:30 PM SEC cutoff)
            echo "IS_VIDEO_RUN=True" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=False"  >> $GITHUB_ENV
            echo "PROBE_RETRIES=2" >> $GITHUB_ENV   # probe at 4:30, retry at 5:00
            # No-op if a manual "Run workflow" (or, in Tiingo mode, an earlier retry)
            # already landed today's complete data — so a heavily-delayed firing of
            # this cron that lands after a manual catch-up doesn't rescan and, more
            # importantly, doesn't build+upload a duplicate category video. On a normal
            # untouched day the data isn't complete yet when this runs, so it runs fully.
            echo "SKIP_IF_COMPLETE=1" >> $GITHUB_ENV
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # manual trigger — full EDGAR refresh + market scan; videos only if
            # explicitly requested via the run_videos input (default: no videos).
            # weekend_mode replicates the weekend cron instead (skip the scan, reuse
            # committed data/latest.json). news_only additionally skips category
            # video generation/upload (e.g. it already published separately) while
            # still running the news report video, which IS_NEWS_RUN gates on its own.
            echo "FORCE_RUN=1"    >> $GITHUB_ENV
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV
            if [ "${{ github.event.inputs.weekend_mode }}" = "true" ]; then
              echo "SKIP_SCAN=1"  >> $GITHUB_ENV
            fi
            if [ "${{ github.event.inputs.run_videos }}" = "true" ]; then
              if [ "${{ github.event.inputs.news_only }}" = "true" ]; then
                echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
              else
                echo "IS_VIDEO_RUN=True" >> $GITHUB_ENV
              fi
              echo "IS_NEWS_RUN=True"  >> $GITHUB_ENV
            else
              echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
              echo "IS_NEWS_RUN=False" >> $GITHUB_ENV
            fi
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "0 21 * * 1-5" ]; then
            # 5:00 PM ET weekdays — skip entirely if 4:30 PM already fully updated (0 stale tickers)
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
            echo "SKIP_IF_COMPLETE=1" >> $GITHUB_ENV
          else
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "IS_NEWS_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV   # 5:30 PM and 6:30 PM: probe once and exit, always run in full
          fi

          # In yfinance mode (OHLCV_SOURCE_SWITCH) the price scan runs for: the 4:30 PM
          # weekday cron (primary), the ~midnight ET cron (0 4 * * 2-6, safety-net — see
          # its branch above; SKIP_IF_COMPLETE makes it a no-op unless the 4:30 PM run
          # was dropped by GitHub's scheduler), the two weekend crons, and manual runs.
          # The 5:00/5:30/6:30 PM weekday retry crons stay excluded — they only ever
          # existed for Tiingo's per-ticker publish delay, which yfinance doesn't have.
          # One trailing exclusion (not per-branch) so a new cron can't silently forget it.
          if [ "${{ env.OHLCV_SOURCE_SWITCH }}" = "yfinance" ] \
             && [ "$SCHEDULE" != "30 20 * * 1-5" ] \
             && [ "$SCHEDULE" != "0 4 * * 2-6" ] \
             && [ "$SCHEDULE" != "0 5 * * 0,6" ] \
             && [ "$SCHEDULE" != "0 14 * * 0,6" ] \
             && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "RUN_PRICE_SCAN=" >> $GITHUB_ENV
          else
            echo "RUN_PRICE_SCAN=1" >> $GITHUB_ENV
          fi

      - name: Run scanner
        if: env.SKIP_SCAN != '1' && (env.IS_HOLIDAY != 'True' || env.EDGAR_ONLY == '1') && env.RUN_PRICE_SCAN == '1'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          OHLCV_SOURCE: ${{ env.OHLCV_SOURCE_SWITCH }}
          EDGAR_ONLY: ${{ env.EDGAR_ONLY }}
          SKIP_EDGAR: ${{ env.SKIP_EDGAR }}
          PROBE_RETRIES: ${{ env.PROBE_RETRIES }}
          FORCE_RUN: ${{ env.FORCE_RUN }}
          SKIP_IF_COMPLETE: ${{ env.SKIP_IF_COMPLETE }}
        run: python scanner_tiingo.py

      - name: Commit updated data
        if: env.SKIP_SCAN != '1' && (env.IS_HOLIDAY != 'True' || env.EDGAR_ONLY == '1')
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Determine run type for worklog (resolved before rebase so it's available)
          SCHEDULE="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"
          if   [ "$SCHEDULE" = "0 5 * * 0,6"  ]; then RUN_TYPE="EDGAR-only"
          elif [ "$SCHEDULE" = "0 4 * * 2-6" ]; then RUN_TYPE="11PM-full"
          elif [ "$SCHEDULE" = "30 20 * * 1-5" ]; then RUN_TYPE="430PM-scan"
          elif [ "$SCHEDULE" = "0 21 * * 1-5"  ]; then RUN_TYPE="500PM-scan"
          elif [ "$SCHEDULE" = "30 21 * * 1-5" ]; then RUN_TYPE="530PM-scan"
          elif [ "$SCHEDULE" = "30 22 * * 1-5" ]; then RUN_TYPE="630PM-scan"
          elif [ "$EVENT"    = "workflow_dispatch" ]; then RUN_TYPE="manual"
          else RUN_TYPE="unknown"; fi
          WORKLOG_ENTRY="$(date -u '+%Y-%m-%d %H:%M UTC')  $RUN_TYPE"

          # Backup generated files, sync with remote, then restore unconditionally.
          # (git stash pop can silently fail on conflict, losing files like compare_*.log)
          TMPBAK=$(mktemp -d)
          cp data/latest.json          "$TMPBAK/" 2>/dev/null || true
          cp data/latest_yfinance.json "$TMPBAK/" 2>/dev/null || true
          cp data/latest_d1.json       "$TMPBAK/" 2>/dev/null || true
          cp data/candles.json         "$TMPBAK/" 2>/dev/null || true
          cp data/index_changes.json   "$TMPBAK/" 2>/dev/null || true
          cp data/index_news.json      "$TMPBAK/" 2>/dev/null || true
          cp data/sp500_symbols.txt    "$TMPBAK/" 2>/dev/null || true
          cp data/nasdaq100_symbols.txt "$TMPBAK/" 2>/dev/null || true
          cp data/fundamentals_cache.json "$TMPBAK/" 2>/dev/null || true
          cp data/splits.json           "$TMPBAK/" 2>/dev/null || true
          cp data/daily_digest.json    "$TMPBAK/" 2>/dev/null || true
          cp data/score_history.json   "$TMPBAK/" 2>/dev/null || true
          cp data/daily_briefing.txt    "$TMPBAK/" 2>/dev/null || true
          cp data/daily_briefing_cn.txt "$TMPBAK/" 2>/dev/null || true
          cp data/market_news.json      "$TMPBAK/" 2>/dev/null || true
          cp data/market_news_cn.json   "$TMPBAK/" 2>/dev/null || true
          find archive -name "results_*.csv" -exec cp {} "$TMPBAK/" \; 2>/dev/null || true
          find archive -name "compare_*.log" -exec cp {} "$TMPBAK/" \; 2>/dev/null || true

          git stash
          git fetch origin main
          git rebase origin/main

          # Restore — overwrite whatever remote had with our fresh scanner output
          cp "$TMPBAK/latest.json"           data/ 2>/dev/null || true
          cp "$TMPBAK/latest_yfinance.json"  data/ 2>/dev/null || true
          cp "$TMPBAK/latest_d1.json"        data/ 2>/dev/null || true
          cp "$TMPBAK/candles.json"          data/ 2>/dev/null || true
          cp "$TMPBAK/index_changes.json"    data/ 2>/dev/null || true
          cp "$TMPBAK/index_news.json"       data/ 2>/dev/null || true
          cp "$TMPBAK/sp500_symbols.txt"     data/ 2>/dev/null || true
          cp "$TMPBAK/nasdaq100_symbols.txt" data/ 2>/dev/null || true
          cp "$TMPBAK/fundamentals_cache.json" data/ 2>/dev/null || true
          cp "$TMPBAK/splits.json"           data/ 2>/dev/null || true
          cp "$TMPBAK/daily_digest.json"     data/ 2>/dev/null || true
          cp "$TMPBAK/score_history.json"    data/ 2>/dev/null || true
          cp "$TMPBAK/daily_briefing.txt"    data/ 2>/dev/null || true
          cp "$TMPBAK/daily_briefing_cn.txt" data/ 2>/dev/null || true
          cp "$TMPBAK/market_news.json"      data/ 2>/dev/null || true
          cp "$TMPBAK/market_news_cn.json"   data/ 2>/dev/null || true
          find "$TMPBAK" -name "results_*.csv" -exec cp {} archive/ \; 2>/dev/null || true
          find "$TMPBAK" -name "compare_*.log" -exec cp {} archive/ \; 2>/dev/null || true

          # Append worklog entry AFTER rebase so parallel-run entries from remote are preserved
          echo "$WORKLOG_ENTRY" >> archive/worklog.md

          git add data/latest.json                     2>/dev/null || true
          git add data/latest_yfinance.json            2>/dev/null || true
          git add data/latest_d1.json                  2>/dev/null || true
          git add data/candles.json                    2>/dev/null || true
          git add data/index_changes.json              2>/dev/null || true
          git add data/index_news.json                 2>/dev/null || true
          git add data/sp500_symbols.txt               2>/dev/null || true
          git add data/nasdaq100_symbols.txt           2>/dev/null || true
          git add data/fundamentals_cache.json         2>/dev/null || true
          git add data/splits.json                     2>/dev/null || true
          git add data/daily_digest.json               2>/dev/null || true
          git add data/score_history.json              2>/dev/null || true
          git add data/baiz_score_trend.json           2>/dev/null || true
          git add data/baizscore_trailing.json         2>/dev/null || true
          git add -f data/daily_briefing.txt            2>/dev/null || true
          git add -f data/daily_briefing_cn.txt         2>/dev/null || true
          git add -f data/market_news.json              2>/dev/null || true
          git add -f data/market_news_cn.json           2>/dev/null || true
          # results_*.csv are transient to this run, not committed
          git add -f archive/compare_*.log             2>/dev/null || true
          git add archive/worklog.md                   2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:main
          fi

      - name: Send daily email digest
        # Only the final weekday run (6:30 PM ET) sends — the 4:30/5:00/5:30 PM
        # crons are same-day retries of the same data, and would otherwise send
        # subscribers 2-4 duplicate emails. No-ops safely (see send_daily_digest.py)
        # until RESEND_API_KEY and FIREBASE_SERVICE_ACCOUNT_JSON are both set.
        if: env.IS_HOLIDAY != 'True' && github.event.schedule == '30 22 * * 1-5'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          python send_daily_digest.py
          rm -f /tmp/firebase-sa.json

      - name: Regenerate stock pages
        if: env.IS_HOLIDAY != 'True' && env.BETA_RUN != '1' && env.EDGAR_ONLY != '1' && env.SKIP_SCAN != '1'
        run: |
          git fetch origin main
          git rebase --autostash origin/main
          python generate_stock_pages.py
          git add stocks/*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No stock page changes"
          else
            git commit -m "auto update stock pages $(date -u)"
            git push origin HEAD:main
          fi

      - name: Update company descriptions for new tickers
        # data/company_descriptions.json is a ticker -> Wikipedia blurb cache used by
        # the candlestick chart modal (assets/candlestick-chart.js). Descriptions
        # barely change, so this only fetches tickers missing from the cache (index
        # reconstitutions, new listings) instead of re-fetching all 500+ daily —
        # same gating as "Regenerate stock pages" since new tickers only show up
        # after a real price scan. Wrong auto-matches go in
        # data/company_description_overrides.json (ticker -> exact Wikipedia title),
        # not here.
        if: env.IS_HOLIDAY != 'True' && env.BETA_RUN != '1' && env.EDGAR_ONLY != '1' && env.SKIP_SCAN != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main
          python fetch_company_descriptions.py
          git add data/company_descriptions.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new company descriptions"
          else
            git commit -m "auto update company descriptions $(date -u)"
            git push origin HEAD:main
          fi

      - name: Update corporate events
        # data/corporate_events.json (splits, M&A, bankruptcy, delisting, leadership
        # changes, material agreements — sourced from SEC 8-K item codes + splits.json)
        # only shows events within +/- 2 months of today, so unlike descriptions this
        # needs re-fetching for every ticker each run (not just new ones) to both pick
        # up fresh filings and drop events that have aged out of the window. Same
        # gating as "Regenerate stock pages" — runs on real scan days, roughly daily,
        # which is frequent enough given 8-Ks are filed within days of the event.
        if: env.IS_HOLIDAY != 'True' && env.BETA_RUN != '1' && env.EDGAR_ONLY != '1' && env.SKIP_SCAN != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main
          python fetch_corporate_events.py
          git add data/corporate_events.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No corporate event changes"
          else
            git commit -m "auto update corporate events $(date -u)"
            # fetch_corporate_events.py takes ~8min for 500+ tickers, so main has
            # likely moved since the rebase above — retry with a fresh rebase on rejection
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Install video dependencies
        if: env.IS_HOLIDAY != 'True' && (env.IS_VIDEO_RUN == 'True' || env.IS_NEWS_RUN == 'True')
        run: |
          pip install -r video/requirements.txt
          sudo apt-get install -y fonts-noto-cjk

      - name: Select daily video types
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True'
        run: |
          DOW=$(date +%u)   # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat 7=Sun
          # Weekend cron (0 14 * * 0,6) runs 10 AM ET / 14:00 UTC — a wide margin to
          # midnight either way, so the wall-clock DOW above is fine there. But the
          # weekday cron fires 20:30 UTC (4:30 PM ET), only ~3.5 h from UTC midnight:
          # a long GitHub Actions schedule delay rolls `date +%u` to the next day and
          # picks the wrong category for a video that's still today's. On weekday runs
          # a real scan happened, so anchor the category to the trading date the scan
          # actually produced (data/latest.json's own "date") — that can't drift no
          # matter when the job runs.
          if [ "$SKIP_SCAN" != "1" ]; then
            DATA_DOW=$(python -c "import json, datetime; print(datetime.date.fromisoformat(json.load(open('data/latest.json'))['date']).isoweekday())" 2>/dev/null || true)
            [ -n "$DATA_DOW" ] && DOW=$DATA_DOW
          fi
          case "$DOW" in
            1) VIDEO_TYPES="near_sma200 near_sma200_cn" ;;
            2) VIDEO_TYPES="1y_vol_peak 1y_vol_peak_cn" ;;
            3) VIDEO_TYPES="6m_breakout 6m_breakout_cn" ;;
            4) VIDEO_TYPES="1y_vol_peak 1y_vol_peak_cn" ;;
            5) VIDEO_TYPES="index_spotlight index_spotlight_cn" ;;
            6) VIDEO_TYPES="worst_performer worst_performer_cn" ;;
            7) VIDEO_TYPES="best_performer best_performer_cn" ;;
            *) VIDEO_TYPES="" ;;
          esac

          # Dedup guard — scheduled weekday runs only. If a language's category video
          # for the current data date + this exact category is already recorded in
          # data/latest_video_meta.json, drop it: a heavily-delayed firing of the
          # 4:30 PM cron that lands after a manual "Run workflow" (with the video
          # option) would otherwise build and re-upload the same video (there is no
          # dedup on YouTube's side). Manual dispatch is never filtered here — a
          # deliberate re-run always regenerates.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$SKIP_SCAN" != "1" ] && [ -n "$VIDEO_TYPES" ]; then
            VIDEO_TYPES=$(VIDEO_TYPES="$VIDEO_TYPES" python -c "
          import json, os
          try:
              data_date = json.load(open('data/latest.json')).get('date')
          except Exception:
              data_date = None
          try:
              meta = json.load(open('data/latest_video_meta.json'))
          except Exception:
              meta = {}
          keep = []
          for t in os.environ['VIDEO_TYPES'].split():
              lang = 'cn' if t.endswith('_cn') else 'en'
              base = t[:-3] if t.endswith('_cn') else t
              m = meta.get(lang, {})
              if data_date and m.get('date') == data_date and m.get('type') == base:
                  continue
              keep.append(t)
          print(' '.join(keep))
          " 2>/dev/null || echo "$VIDEO_TYPES")
          fi

          echo "VIDEO_TYPES=$VIDEO_TYPES" >> $GITHUB_ENV

      - name: Generate daily videos
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          # Shorts (vertical 9:16) replace the old landscape long-form videos as of
          # 2026-07-04 — same output path convention (video/${type}.mp4) so every
          # downstream step (copy/upload/skip-logging) below is unchanged.
          #
          # Weekend runs (SKIP_SCAN=1) reuse Friday's already-committed data/latest.json,
          # whose "date" field is still Friday's — so worst_performer/best_performer (the
          # Saturday/Sunday categories — best_performer moved here from Tuesday 2026-08-15)
          # need an explicit override to show the actual Saturday/Sunday calendar date
          # on-screen instead of Friday's. Weekday runs have a fresh scan (date already
          # correct), so no override there. This DATE_ARGS logic itself is generic (keyed
          # off SKIP_SCAN, not the specific category), so it automatically follows
          # whichever type is scheduled on a given day — no change needed here when the
          # day->category mapping above changes.
          #
          # avg_volume retired from the rotation 2026-08-15 (was Sunday, briefly moved to
          # Tuesday, then dropped — user said it "is not very popular"). Tuesday now reuses
          # Thursday's 1y_vol_peak category outright, calling the exact same build function
          # (build_1y_vol_peak_short) with each day's own current data — since its window
          # rotation (_thursday_tf in generate_video.py) is keyed by ISO calendar week, not
          # by a per-weekday call count, Tuesday and Thursday automatically show the same
          # 3M/6M/9M/1Y window in a given week with no extra state needed, doubling this
          # category's weekly frequency instead of splitting it across two different topics.
          # avg_volume's code (generate_shorts.py/upload_youtube.py) is left in place, just
          # unreferenced by any day here — not deleted in case it's wanted again later.
          DATE_ARGS=()
          if [ "$SKIP_SCAN" = "1" ]; then
            TODAY_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
            DATE_ARGS=(--date-override "$TODAY_DATE")
          fi
          for type in $VIDEO_TYPES; do
            if echo "$type" | grep -q "_cn$"; then
              BASE_TYPE="${type%_cn}"
              LANG="cn"
            else
              BASE_TYPE="$type"
              LANG="en"
            fi
            python video/generate_shorts.py --type "$BASE_TYPE" --lang "$LANG" --output "video/${type}.mp4" --share-dir data/social_cards "${DATE_ARGS[@]}"
          done
          # Copy generated videos to fixed paths and write name metadata
          EN_NAME="" CN_NAME="" EN_TYPE="" CN_TYPE=""
          for type in $VIDEO_TYPES; do
            if [ -f "video/${type}.mp4" ]; then
              if echo "$type" | grep -q "_cn$"; then
                cp "video/${type}.mp4" data/latest_video_cn.mp4
                CN_TYPE="${type%_cn}"
                case "$type" in
                  near_sma200_cn)      CN_NAME="回踩200日均线" ;;
                  best_performer_cn)   CN_NAME="最佳涨幅股" ;;
                  6m_breakout_cn)      CN_NAME="6个月突破" ;;
                  1y_vol_peak_cn)      CN_NAME="年成交量峰值" ;;
                  index_spotlight_cn)  CN_NAME="指数聚焦" ;;
                  worst_performer_cn)  CN_NAME="最差跌幅股" ;;
                  avg_volume_cn)       CN_NAME="日均成交量最高" ;;
                esac
              else
                cp "video/${type}.mp4" data/latest_video_en.mp4
                EN_TYPE="$type"
                case "$type" in
                  near_sma200)      EN_NAME="Testing 200-Day Support" ;;
                  best_performer)   EN_NAME="Top Price Movers" ;;
                  6m_breakout)      EN_NAME="6-Month Breakout" ;;
                  1y_vol_peak)      EN_NAME="1Y Volume Peak" ;;
                  index_spotlight)  EN_NAME="Index Spotlight" ;;
                  worst_performer)  EN_NAME="Worst Performers" ;;
                  avg_volume)       EN_NAME="Highest Average Volume" ;;
                esac
              fi
            fi
          done
          # Merge rather than overwrite: if a type was skipped this run (e.g. too few
          # qualifying stocks), data/latest_video_en.mp4 / _cn.mp4 above were never
          # copied and still hold whatever was last published — so that side's
          # name/date/url must stay as-is too, instead of advancing to today's date
          # for a video that didn't actually change.
          # On weekend runs data/latest.json's date is still Friday's (SKIP_SCAN=1,
          # no fresh scan) — reuse the same TODAY_DATE the video itself was rendered
          # with above, so the homepage's video date matches what's on-screen.
          if [ "$SKIP_SCAN" = "1" ]; then
            VID_DATE="$TODAY_DATE"
          else
            VID_DATE=$(python -c "import json; print(json.load(open('data/latest.json'))['date'])")
          fi
          EN_NAME="$EN_NAME" EN_DATE="$VID_DATE" EN_TYPE="$EN_TYPE" CN_NAME="$CN_NAME" CN_DATE="$VID_DATE" CN_TYPE="$CN_TYPE" python -c "
          import json, os

          try:
              meta = json.load(open('data/latest_video_meta.json'))
          except Exception:
              meta = {'en': {'name': '', 'date': '', 'url': ''}, 'cn': {'name': '', 'date': '', 'url': ''}}

          en_name = os.environ.get('EN_NAME', '')
          cn_name = os.environ.get('CN_NAME', '')

          # 'type' is the category slug (e.g. index_spotlight) — used by the 'Select
          # daily video types' dedup guard to tell whether today's video was already made.
          if en_name:
              meta['en'] = {'name': en_name, 'type': os.environ.get('EN_TYPE', ''), 'date': os.environ['EN_DATE'], 'url': ''}
          if cn_name:
              meta['cn'] = {'name': cn_name, 'type': os.environ.get('CN_TYPE', ''), 'date': os.environ['CN_DATE'], 'url': ''}

          json.dump(meta, open('data/latest_video_meta.json', 'w'))
          "

      - name: Update share-card gallery (rolling 30 days)
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          # generate_shorts.py (run above with --share-dir) drops one
          # _manifest_{lang}.json fragment per language into data/social_cards/ —
          # this merges both into the rolling gallery list. The homepage only
          # shows the newest few (client-side slice), while chart_archive.html /
          # chart_archive_cn.html (subscription-gated) show the full 30-day
          # window from this same file — so prune at 30 days, not 7, so neither
          # the repo nor the archive page's data grows unbounded.
          python -c "
          import json, glob, os
          from datetime import date, timedelta

          out_dir = 'data/social_cards'
          meta_path = 'data/latest_social_cards_meta.json'
          cutoff = (date.today() - timedelta(days=30)).isoformat()

          try:
              entries = json.load(open(meta_path, encoding='utf-8'))
          except Exception:
              entries = []

          for frag_path in glob.glob(os.path.join(out_dir, '_manifest_*.json')):
              entries.extend(json.load(open(frag_path, encoding='utf-8')))
              os.remove(frag_path)

          # De-dupe (a re-run for the same date/type/lang/idx overwrites the same
          # file — keep the newest entry for that filename) and drop anything
          # past the 30-day window, deleting the now-unreferenced PNG from disk too.
          by_file = {}
          for e in entries:
              by_file[e['file']] = e
          kept, dropped = [], []
          for e in by_file.values():
              (kept if e['date'] >= cutoff else dropped).append(e)
          kept.sort(key=lambda e: (e['date'], e['video_type'], e['lang'], e['file']), reverse=True)

          for e in dropped:
              p = os.path.join(out_dir, e['file'])
              if os.path.exists(p):
                  os.remove(p)

          json.dump(kept, open(meta_path, 'w', encoding='utf-8'), ensure_ascii=False)
          print(f'Share-card gallery: {len(kept)} kept, {len(dropped)} pruned (older than {cutoff})')
          "

      - name: Upload daily videos to YouTube
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # Same weekend override as the "Generate daily videos" step above: on
          # SKIP_SCAN=1 runs, data/latest.json's date is still Friday's, but the
          # video was rendered (and latest_video_meta.json written) with the real
          # ET calendar date. Reuse that here too so the YouTube title matches
          # what's on-screen instead of showing Friday's date on weekends.
          if [ "$SKIP_SCAN" = "1" ]; then
            DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          else
            DATE=$(python -c "import json; print(json.load(open('data/latest.json'))['date'])")
          fi
          for type in $VIDEO_TYPES; do
            if [ -f "video/${type}.mp4" ]; then
              OUT=$(python video/upload_youtube.py --file video/${type}.mp4 --type $type --date $DATE)
              echo "$OUT"
              YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
              if [ -n "$YT_URL" ]; then
                if echo "$type" | grep -q "_cn$"; then
                  python -c "import json,sys; m=json.load(open('data/latest_video_meta.json')); m['cn']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_meta.json','w'))" "$YT_URL"
                else
                  python -c "import json,sys; m=json.load(open('data/latest_video_meta.json')); m['en']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_meta.json','w'))" "$YT_URL"
                fi
              fi
            else
              echo "Skipping $type — no qualifying stocks today"
            fi
          done

      - name: Commit latest videos for homepage download
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          # This step used to implicitly rely on "Commit updated data" (above) having
          # already set git identity — fine when that step always ran first, but it's
          # skipped whenever SKIP_SCAN=1 (weekend runs). Weekend runs never used to
          # reach this step (IS_VIDEO_RUN was False on weekends), but now that Sat/Sun
          # also generate category videos, this step runs with no identity set and
          # `git commit` fails with "empty ident name". Set it explicitly here, same
          # fix already applied to "Generate news report videos" for the same reason.
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add -f data/latest_video_en.mp4 2>/dev/null || true
          git add -f data/latest_video_cn.mp4 2>/dev/null || true
          git add data/latest_video_meta.json 2>/dev/null || true
          # -A (not -f on a glob) so pruned share-card PNGs are staged as deletions
          # too, not just new/changed files — keeps the repo from growing forever.
          git add -A data/social_cards/ 2>/dev/null || true
          git add data/latest_social_cards_meta.json 2>/dev/null || true
          # Friday-only rotation position for build_index_spotlight_short()'s
          # candidate pick (see _pick_spotlight_rotation) — must be committed or
          # every run starts back at the beginning since each GH Actions run is a
          # fresh checkout with no other persistence.
          git add data/spotlight_rotation_en.json 2>/dev/null || true
          git add data/spotlight_rotation_cn.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No video files changed, skipping commit"
          else
            git commit -m "auto update latest videos $(date -u)"
            git push origin HEAD:main
          fi

      - name: Log skipped videos to worklog
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          SKIPPED=""
          for type in $VIDEO_TYPES; do
            [ ! -f "video/${type}.mp4" ] && SKIPPED="$SKIPPED $type"
          done
          [ -z "$SKIPPED" ] && exit 0
          git fetch origin main
          git rebase --autostash origin/main
          echo "  no-video (no qualifying stocks):$SKIPPED" >> archive/worklog.md
          git add archive/worklog.md
          git commit -m "log: video skipped — no qualifying stocks"
          git push origin main

      - name: Generate news report videos
        if: env.IS_HOLIDAY != 'True' && env.IS_NEWS_RUN == 'True'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # On the weekend news-only cron, SKIP_SCAN skips "Commit updated data"
          # (which normally sets git identity + does the mid-job fetch/rebase) —
          # set identity and pull explicitly here so this step reliably sees the
          # latest data/market_news*.json (refreshed daily around noon ET by the
          # separate news_refresh.py workflow, independent of this one).
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase --autostash origin/main

          # ET date, not the runner's UTC clock — this run isn't tied to a market
          # scan (data/latest.json may be stale on the weekend cron), so the news
          # report's own date must be computed independently.
          NEWS_DATE=$(TZ='America/New_York' date +%Y-%m-%d)

          # On the 3:30 PM ET retry cron only: skip a language whose video already
          # shows today's date in the meta file, so a healthy 1:00 PM ET run makes
          # this a no-op rather than double-generating/double-uploading. The primary
          # 1:00 PM run and manual dispatches always regenerate unconditionally.
          SKIP_EN="" SKIP_CN=""
          if [ "${{ github.event.schedule }}" = "30 19 * * *" ]; then
            EXISTING=$(NEWS_DATE="$NEWS_DATE" python -c "
          import json, os
          try:
              meta = json.load(open('data/latest_video_news_meta.json'))
          except Exception:
              meta = {}
          today = os.environ['NEWS_DATE']
          print('EN=1' if meta.get('en', {}).get('date') == today else 'EN=')
          print('CN=1' if meta.get('cn', {}).get('date') == today else 'CN=')
          ")
            SKIP_EN=$(echo "$EXISTING" | grep '^EN=' | cut -d= -f2)
            SKIP_CN=$(echo "$EXISTING" | grep '^CN=' | cut -d= -f2)
          fi

          if [ -n "$SKIP_EN" ]; then
            echo "EN news video already generated today — skipping retry"
          else
            python video/generate_news_report.py --lang en --output video/news_report_en.mp4 --date "$NEWS_DATE" || true
          fi
          if [ -n "$SKIP_CN" ]; then
            echo "CN news video already generated today — skipping retry"
          else
            python video/generate_news_report.py --lang cn --output video/news_report_cn.mp4 --date "$NEWS_DATE" || true
          fi

          EN_NAME="" CN_NAME=""
          if [ -f video/news_report_en.mp4 ]; then
            cp video/news_report_en.mp4 data/latest_video_news_en.mp4
            EN_NAME="Daily Market News"
          fi
          if [ -f video/news_report_cn.mp4 ]; then
            cp video/news_report_cn.mp4 data/latest_video_news_cn.mp4
            CN_NAME="每日市场新闻"
          fi

          # Same merge-not-overwrite fix as the category-video meta (commit
          # cfb67c4 / db8448a): if a language was skipped (e.g. the Claude API
          # call failed, or no genuine stories survived filtering), leave that
          # side's name/date/url exactly as it was rather than stamping today's
          # date on a video that didn't actually change.
          EN_NAME="$EN_NAME" EN_DATE="$NEWS_DATE" CN_NAME="$CN_NAME" CN_DATE="$NEWS_DATE" python -c "
          import json, os

          try:
              meta = json.load(open('data/latest_video_news_meta.json'))
          except Exception:
              meta = {'en': {'name': '', 'date': '', 'url': ''}, 'cn': {'name': '', 'date': '', 'url': ''}}

          en_name = os.environ.get('EN_NAME', '')
          cn_name = os.environ.get('CN_NAME', '')

          if en_name:
              meta['en'] = {'name': en_name, 'date': os.environ['EN_DATE'], 'url': ''}
          if cn_name:
              meta['cn'] = {'name': cn_name, 'date': os.environ['CN_DATE'], 'url': ''}

          json.dump(meta, open('data/latest_video_news_meta.json', 'w'))
          "

      - name: Upload news report to YouTube
        if: env.IS_HOLIDAY != 'True' && env.IS_NEWS_RUN == 'True' && env.NEWS_UPLOAD_YOUTUBE != 'False'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # News video (EN + CN) uploads to the baizora-en3 channel, not @baizorastock
          # (which still gets the Mon-Fri category Shorts via YOUTUBE_REFRESH_TOKEN above).
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_SECONDARY_REFRESH_TOKEN }}
        run: |
          NEWS_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          # video/generate_news_report.py writes news_report_en.mp4 / news_report_cn.mp4
          # (both suffixed), but make_meta() in upload_youtube.py keys titles off the
          # bare "news_report" (EN) / "news_report_cn" (CN) --type values — so file name
          # and --type diverge for EN specifically. Map them explicitly rather than
          # assuming "$type.mp4" is the real file (that mismatch silently made every EN
          # news video skip its own upload while CN uploaded fine).
          for pair in "news_report:news_report_en" "news_report_cn:news_report_cn"; do
            TYPE="${pair%%:*}"
            FILE="${pair##*:}"
            if [ -f "video/${FILE}.mp4" ]; then
              OUT=$(python video/upload_youtube.py --file "video/${FILE}.mp4" --type "$TYPE" --date "$NEWS_DATE")
              echo "$OUT"
              YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
              if [ -n "$YT_URL" ]; then
                if echo "$TYPE" | grep -q "_cn$"; then
                  python -c "import json,sys; m=json.load(open('data/latest_video_news_meta.json')); m['cn']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_news_meta.json','w'))" "$YT_URL"
                else
                  python -c "import json,sys; m=json.load(open('data/latest_video_news_meta.json')); m['en']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_news_meta.json','w'))" "$YT_URL"
                fi
              fi
            else
              echo "Skipping $TYPE — no news report generated today"
            fi
          done

      - name: Commit latest news report videos for homepage download
        if: env.IS_HOLIDAY != 'True' && env.IS_NEWS_RUN == 'True'
        run: |
          git fetch origin main
          git rebase --autostash origin/main
          git add -f data/latest_video_news_en.mp4 2>/dev/null || true
          git add -f data/latest_video_news_cn.mp4 2>/dev/null || true
          git add data/latest_video_news_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No news report video files changed, skipping commit"
          else
            git commit -m "auto update latest news report videos $(date -u)"
            git push origin HEAD:main
          fi

      - name: Log skipped news report to worklog
        if: env.IS_HOLIDAY != 'True' && env.IS_NEWS_RUN == 'True'
        run: |
          SKIPPED=""
          for pair in "news_report:news_report_en" "news_report_cn:news_report_cn"; do
            TYPE="${pair%%:*}"
            FILE="${pair##*:}"
            [ ! -f "video/${FILE}.mp4" ] && SKIPPED="$SKIPPED $TYPE"
          done
          [ -z "$SKIPPED" ] && exit 0
          git fetch origin main
          git rebase --autostash origin/main
          echo "  no-news-video (Claude API failed or no qualifying stories):$SKIPPED" >> archive/worklog.md
          git add archive/worklog.md
          git commit -m "log: news report video skipped"
          git push origin main

