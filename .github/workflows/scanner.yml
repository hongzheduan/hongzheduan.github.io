name: Baizora Scanner

on:
  schedule:
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit updated latest.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Pull latest remote changes first to avoid diverged history
          git pull --rebase origin ${{ github.ref_name }}

          git add data/latest.json || echo "data/latest.json not found, skipping"
          git add archive/*.csv 2>/dev/null || echo "No archive csv files found, skipping"

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:${{ github.ref_name }}
          fi