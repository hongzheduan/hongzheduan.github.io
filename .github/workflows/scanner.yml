name: Baizora Scanner

on:
  schedule:
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit updated latest.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Stash scanner output, sync with remote, then restore
          git stash --include-untracked
          git fetch origin main
          git rebase origin/main
          git stash pop

          git add data/latest.json || echo "data/latest.json not found, skipping"
          git add data/index_changes.json 2>/dev/null || echo "data/index_changes.json not found, skipping"
          git add data/sp500_symbols.txt data/nasdaq100_symbols.txt 2>/dev/null || echo "Symbol files not found, skipping"
          git add archive/*.csv 2>/dev/null || echo "No archive csv files found, skipping"

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:main
          fi