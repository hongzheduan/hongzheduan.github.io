name: Baizora Scanner

on:
  schedule:
    - cron: "30 20 * * 1-5"   # weekdays 8:30 PM UTC – scan + daily videos
    - cron: "0 12 * * 6"       # Saturday noon UTC – weekend videos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        if: github.event.schedule != '0 12 * * 6'
        run: python scanner.py

      - name: Commit updated latest.json
        if: github.event.schedule != '0 12 * * 6'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Stash scanner output, sync with remote, then restore
          git stash --include-untracked
          git fetch origin main
          git rebase origin/main
          git stash pop

          git add data/latest.json || echo "data/latest.json not found, skipping"
          git add data/index_changes.json 2>/dev/null || echo "data/index_changes.json not found, skipping"
          git add data/sp500_symbols.txt data/nasdaq100_symbols.txt 2>/dev/null || echo "Symbol files not found, skipping"
          git add archive/*.csv 2>/dev/null || echo "No archive csv files found, skipping"

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:main
          fi

      - name: Install video dependencies
        run: |
          pip install -r video/requirements.txt
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate weekday videos
        if: github.event.schedule != '0 12 * * 6'
        run: |
          for type in sp500_movers nasdaq_movers volume_spikes extreme_1y volume_spikes_cn; do
            python video/generate_video.py --type $type
          done

      - name: Generate weekend videos
        if: github.event.schedule == '0 12 * * 6'
        run: |
          for type in platform_intro platform_intro_cn; do
            python video/generate_video.py --type $type
          done

      - name: Upload videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: video/*.mp4
          retention-days: 7