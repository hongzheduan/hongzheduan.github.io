name: Baizora Scanner

on:
  schedule:
    - cron: "0 17 * * 1-5"    # 1:00 PM ET weekdays — beta IEX snapshot (~4:00 PM ET actual due to GH delay); exits if started ≥3:55 PM ET
    - cron: "30 20 * * 1-5"   # 4:30 PM ET weekdays  — preliminary data + videos (retries at 5:00 PM)
    - cron: "30 21 * * 1-5"   # 5:30 PM ET weekdays  — retry if 4:30 PM data not yet available
    - cron: "30 22 * * 1-5"   # 6:30 PM ET weekdays  — final data
    - cron: "0 4 * * 2-6"    # 11 PM ET weekdays — full EDGAR + market scan, no videos
    - cron: "0 5 * * 0,6"    # midnight ET weekends — EDGAR refresh only
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check market holiday and run type
        run: |
          IS_HOLIDAY=$(python -c "from scanner_tiingo import is_market_holiday; print(is_market_holiday())")
          echo "IS_HOLIDAY=$IS_HOLIDAY" >> $GITHUB_ENV

          SCHEDULE="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"

          # midnight ET cron → EDGAR-only refresh, skip market scan
          if [ "$SCHEDULE" = "0 5 * * 0,6" ]; then
            echo "EDGAR_ONLY=1"    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "0 4 * * 2-6" ]; then
            # 11 PM ET weekdays — full EDGAR + market scan, no videos
            echo "FORCE_RUN=1"    >> $GITHUB_ENV
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "0 17 * * 1-5" ]; then
            echo "BETA_RUN=1"     >> $GITHUB_ENV
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          elif [ "$SCHEDULE" = "30 20 * * 1-5" ]; then
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV   # run EDGAR (~6:30 PM ET actual, after 5:30 PM SEC cutoff)
            echo "IS_VIDEO_RUN=True" >> $GITHUB_ENV
            echo "PROBE_RETRIES=2" >> $GITHUB_ENV   # probe at 4:30, retry at 5:00
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # manual trigger — full EDGAR refresh + market scan, no videos
            echo "FORCE_RUN=1"    >> $GITHUB_ENV
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR="    >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV
          else
            echo "EDGAR_ONLY="    >> $GITHUB_ENV
            echo "SKIP_EDGAR=1"   >> $GITHUB_ENV
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
            echo "PROBE_RETRIES=1" >> $GITHUB_ENV   # 5:30 PM and 6:30 PM: probe once and exit
          fi

      - name: Run scanner
        if: env.IS_HOLIDAY != 'True' || env.EDGAR_ONLY == '1'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EDGAR_ONLY: ${{ env.EDGAR_ONLY }}
          SKIP_EDGAR: ${{ env.SKIP_EDGAR }}
          PROBE_RETRIES: ${{ env.PROBE_RETRIES }}
          FORCE_RUN: ${{ env.FORCE_RUN }}
          BETA_RUN: ${{ env.BETA_RUN }}
        run: python scanner_tiingo.py

      - name: Commit updated data
        if: env.IS_HOLIDAY != 'True' || env.EDGAR_ONLY == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Determine run type for worklog (resolved before rebase so it's available)
          SCHEDULE="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"
          if   [ "$SCHEDULE" = "0 5 * * 0,6"  ]; then RUN_TYPE="EDGAR-only"
          elif [ "$SCHEDULE" = "0 4 * * 2-6" ]; then RUN_TYPE="11PM-full"
          elif [ "$SCHEDULE" = "0 17 * * 1-5" ]; then RUN_TYPE="100PM-beta"
          elif [ "$SCHEDULE" = "30 20 * * 1-5" ]; then RUN_TYPE="430PM-scan"
          elif [ "$SCHEDULE" = "30 21 * * 1-5" ]; then RUN_TYPE="530PM-scan"
          elif [ "$SCHEDULE" = "30 22 * * 1-5" ]; then RUN_TYPE="630PM-scan"
          elif [ "$EVENT"    = "workflow_dispatch" ]; then RUN_TYPE="manual"
          else RUN_TYPE="unknown"; fi
          WORKLOG_ENTRY="$(date -u '+%Y-%m-%d %H:%M UTC')  $RUN_TYPE"

          # Backup generated files, sync with remote, then restore unconditionally.
          # (git stash pop can silently fail on conflict, losing files like compare_*.log)
          TMPBAK=$(mktemp -d)
          cp data/latest.json          "$TMPBAK/" 2>/dev/null || true
          cp data/latest_d1.json       "$TMPBAK/" 2>/dev/null || true
          cp data/free_tier.json       "$TMPBAK/" 2>/dev/null || true
          cp data/candles.json         "$TMPBAK/" 2>/dev/null || true
          cp data/index_changes.json   "$TMPBAK/" 2>/dev/null || true
          cp data/index_news.json      "$TMPBAK/" 2>/dev/null || true
          cp data/sp500_symbols.txt    "$TMPBAK/" 2>/dev/null || true
          cp data/nasdaq100_symbols.txt "$TMPBAK/" 2>/dev/null || true
          cp data/fundamentals_cache.json "$TMPBAK/" 2>/dev/null || true
          cp data/splits.json           "$TMPBAK/" 2>/dev/null || true
          cp data/daily_digest.json    "$TMPBAK/" 2>/dev/null || true
          cp data/score_history.json   "$TMPBAK/" 2>/dev/null || true
          cp data/daily_briefing.txt    "$TMPBAK/" 2>/dev/null || true
          cp data/daily_briefing_cn.txt "$TMPBAK/" 2>/dev/null || true
          cp data/market_news.json      "$TMPBAK/" 2>/dev/null || true
          cp data/market_news_cn.json   "$TMPBAK/" 2>/dev/null || true
          find archive -name "results_*.csv" -exec cp {} "$TMPBAK/" \; 2>/dev/null || true
          find archive -name "compare_*.log" -exec cp {} "$TMPBAK/" \; 2>/dev/null || true

          git stash
          git fetch origin main
          git rebase origin/main

          # Restore — overwrite whatever remote had with our fresh scanner output
          cp "$TMPBAK/latest.json"           data/ 2>/dev/null || true
          cp "$TMPBAK/latest_d1.json"        data/ 2>/dev/null || true
          cp "$TMPBAK/free_tier.json"        data/ 2>/dev/null || true
          cp "$TMPBAK/candles.json"          data/ 2>/dev/null || true
          cp "$TMPBAK/index_changes.json"    data/ 2>/dev/null || true
          cp "$TMPBAK/index_news.json"       data/ 2>/dev/null || true
          cp "$TMPBAK/sp500_symbols.txt"     data/ 2>/dev/null || true
          cp "$TMPBAK/nasdaq100_symbols.txt" data/ 2>/dev/null || true
          cp "$TMPBAK/fundamentals_cache.json" data/ 2>/dev/null || true
          cp "$TMPBAK/splits.json"           data/ 2>/dev/null || true
          cp "$TMPBAK/daily_digest.json"     data/ 2>/dev/null || true
          cp "$TMPBAK/score_history.json"    data/ 2>/dev/null || true
          cp "$TMPBAK/daily_briefing.txt"    data/ 2>/dev/null || true
          cp "$TMPBAK/daily_briefing_cn.txt" data/ 2>/dev/null || true
          cp "$TMPBAK/market_news.json"      data/ 2>/dev/null || true
          cp "$TMPBAK/market_news_cn.json"   data/ 2>/dev/null || true
          find "$TMPBAK" -name "results_*.csv" -exec cp {} archive/ \; 2>/dev/null || true
          find "$TMPBAK" -name "compare_*.log" -exec cp {} archive/ \; 2>/dev/null || true

          # Append worklog entry AFTER rebase so parallel-run entries from remote are preserved
          echo "$WORKLOG_ENTRY" >> archive/worklog.md

          git add data/latest.json                     2>/dev/null || true
          git add data/latest_d1.json                  2>/dev/null || true
          git add data/free_tier.json                  2>/dev/null || true
          git add data/candles.json                    2>/dev/null || true
          git add data/index_changes.json              2>/dev/null || true
          git add data/index_news.json                 2>/dev/null || true
          git add data/sp500_symbols.txt               2>/dev/null || true
          git add data/nasdaq100_symbols.txt           2>/dev/null || true
          git add data/fundamentals_cache.json         2>/dev/null || true
          git add data/splits.json                     2>/dev/null || true
          git add data/daily_digest.json               2>/dev/null || true
          git add data/score_history.json              2>/dev/null || true
          git add -f data/daily_briefing.txt            2>/dev/null || true
          git add -f data/daily_briefing_cn.txt         2>/dev/null || true
          git add -f data/market_news.json              2>/dev/null || true
          git add -f data/market_news_cn.json           2>/dev/null || true
          # results_*.csv are pushed gzipped to scanner-archive repo, not committed here
          git add -f archive/compare_*.log             2>/dev/null || true
          git add archive/worklog.md                   2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:main
          fi

      - name: Regenerate stock pages
        if: env.IS_HOLIDAY != 'True' && env.BETA_RUN != '1' && env.EDGAR_ONLY != '1'
        run: |
          git fetch origin main
          git rebase --autostash origin/main
          python generate_stock_pages.py
          git add stocks/*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No stock page changes"
          else
            git commit -m "auto update stock pages $(date -u)"
            git push origin HEAD:main
          fi

      - name: Install video dependencies
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True'
        run: |
          pip install -r video/requirements.txt
          sudo apt-get install -y fonts-noto-cjk

      - name: Select daily video types
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True'
        run: |
          DOW=$(date +%u)   # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri
          if [ "$DOW" = "1" ]; then
            echo "VIDEO_TYPES=volume_spikes volume_spikes_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "2" ]; then
            echo "VIDEO_TYPES=best_performer best_performer_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "3" ]; then
            echo "VIDEO_TYPES=6m_breakout 6m_breakout_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "4" ]; then
            echo "VIDEO_TYPES=1y_vol_peak 1y_vol_peak_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "5" ]; then
            echo "VIDEO_TYPES=index_spotlight index_spotlight_cn" >> $GITHUB_ENV
          else
            echo "VIDEO_TYPES=" >> $GITHUB_ENV
          fi

      - name: Generate daily videos
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          for type in $VIDEO_TYPES; do
            python video/generate_video.py --type $type
          done
          # Copy generated videos to fixed paths and write name metadata
          EN_NAME="" CN_NAME=""
          for type in $VIDEO_TYPES; do
            if [ -f "video/${type}.mp4" ]; then
              if echo "$type" | grep -q "_cn$"; then
                cp "video/${type}.mp4" data/latest_video_cn.mp4
                case "$type" in
                  volume_spikes_cn)   CN_NAME="异常成交量" ;;
                  best_performer_cn)  CN_NAME="最佳涨幅股" ;;
                  6m_breakout_cn)     CN_NAME="6个月突破" ;;
                  1y_vol_peak_cn)     CN_NAME="年成交量峰值" ;;
                  index_spotlight_cn) CN_NAME="指数聚焦" ;;
                esac
              else
                cp "video/${type}.mp4" data/latest_video_en.mp4
                case "$type" in
                  volume_spikes)   EN_NAME="Unusual Volume Spikes" ;;
                  best_performer)  EN_NAME="Top Price Movers" ;;
                  6m_breakout)     EN_NAME="6-Month Breakout" ;;
                  1y_vol_peak)     EN_NAME="1Y Volume Peak" ;;
                  index_spotlight) EN_NAME="Index Spotlight" ;;
                esac
              fi
            fi
          done
          VID_DATE=$(python -c "import json; print(json.load(open('data/latest.json'))['date'])")
          printf '{"en":{"name":"%s","date":"%s","url":""},"cn":{"name":"%s","date":"%s","url":""}}' \
            "$EN_NAME" "$VID_DATE" "$CN_NAME" "$VID_DATE" > data/latest_video_meta.json

      - name: Upload daily videos to YouTube
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DATE=$(python -c "import json; print(json.load(open('data/latest.json'))['date'])")
          for type in $VIDEO_TYPES; do
            if [ -f "video/${type}.mp4" ]; then
              OUT=$(python video/upload_youtube.py --file video/${type}.mp4 --type $type --date $DATE)
              echo "$OUT"
              YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
              if [ -n "$YT_URL" ]; then
                if echo "$type" | grep -q "_cn$"; then
                  python -c "import json,sys; m=json.load(open('data/latest_video_meta.json')); m['cn']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_meta.json','w'))" "$YT_URL"
                else
                  python -c "import json,sys; m=json.load(open('data/latest_video_meta.json')); m['en']['url']=sys.argv[1]; json.dump(m,open('data/latest_video_meta.json','w'))" "$YT_URL"
                fi
              fi
            else
              echo "Skipping $type — no qualifying stocks today"
            fi
          done

      - name: Commit latest videos for homepage download
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          git fetch origin main
          git rebase --autostash origin/main
          git add -f data/latest_video_en.mp4 2>/dev/null || true
          git add -f data/latest_video_cn.mp4 2>/dev/null || true
          git add data/latest_video_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No video files changed, skipping commit"
          else
            git commit -m "auto update latest videos $(date -u)"
            git push origin HEAD:main
          fi

      - name: Log skipped videos to worklog
        if: env.IS_HOLIDAY != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          SKIPPED=""
          for type in $VIDEO_TYPES; do
            [ ! -f "video/${type}.mp4" ] && SKIPPED="$SKIPPED $type"
          done
          [ -z "$SKIPPED" ] && exit 0
          git fetch origin main
          git rebase --autostash origin/main
          echo "  no-video (no qualifying stocks):$SKIPPED" >> archive/worklog.md
          git add archive/worklog.md
          git commit -m "log: video skipped — no qualifying stocks"
          git push origin main

      - name: Push gzipped CSV to scanner-archive
        if: env.IS_HOLIDAY != 'True' && github.event.schedule == '0 4 * * 2-6'
        env:
          ARCHIVE_PAT: ${{ secrets.ARCHIVE_PAT }}
        run: |
          CSV=$(find archive -name "results_*.csv" | sort | tail -1)
          [ -z "$CSV" ] && exit 0
          gzip -k "$CSV"
          GZ="${CSV}.gz"
          git clone "https://hongzheduan:${ARCHIVE_PAT}@github.com/hongzheduan/scanner-archive.git" /tmp/scanner-archive
          cp "$GZ" /tmp/scanner-archive/
          cd /tmp/scanner-archive
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "archive $(basename $GZ)"
          git push
