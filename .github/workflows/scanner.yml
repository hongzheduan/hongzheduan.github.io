name: Baizora Scanner

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 6:00 PM ET weekdays — preliminary data + videos
    - cron: "0 0 * * 2-6"    # 8:00 PM ET weekdays — final data
    - cron: "0 0 * * 0"      # 8:00 PM ET Saturday — weekend EDGAR refresh
    - cron: "0 0 * * 1"      # 8:00 PM ET Sunday  — weekend EDGAR refresh
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check market holiday and run type
        run: |
          IS_HOLIDAY=$(python -c "from scanner_tiingo import is_market_holiday; print(is_market_holiday())")
          echo "IS_HOLIDAY=$IS_HOLIDAY" >> $GITHUB_ENV

          DOW=$(date +%u)   # 1=Mon … 6=Sat, 7=Sun
          HOUR=$(date +%H)

          # IS_WEEKEND: true on Sat/Sun UTC, and on Mon midnight UTC (= Sun 8 PM ET).
          # Used to skip video generation on days without fresh market data.
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ]; then
            echo "IS_WEEKEND=True" >> $GITHUB_ENV
          elif [ "$DOW" = "1" ] && [ "$HOUR" = "00" ]; then
            echo "IS_WEEKEND=True" >> $GITHUB_ENV
          else
            echo "IS_WEEKEND=False" >> $GITHUB_ENV
          fi

          # FORCE_RUN=1 bypasses the weekend guard inside scanner_tiingo.py.
          # Needed for Sun-midnight UTC (DOW=7, Sat 8 PM ET) and Mon-midnight UTC
          # (DOW=1 + HOUR=00, Sun 8 PM ET) — days with no Tiingo market data.
          if [ "$DOW" = "7" ]; then
            echo "FORCE_RUN=1" >> $GITHUB_ENV
          elif [ "$DOW" = "1" ] && [ "$HOUR" = "00" ]; then
            echo "FORCE_RUN=1" >> $GITHUB_ENV
          else
            echo "FORCE_RUN=" >> $GITHUB_ENV
          fi

          # Videos run on the 6 PM ET run (22:xx UTC).
          if [ "$HOUR" = "22" ] || [ "$HOUR" = "23" ]; then
            echo "IS_VIDEO_RUN=True" >> $GITHUB_ENV
          else
            echo "IS_VIDEO_RUN=False" >> $GITHUB_ENV
          fi

      - name: Run scanner
        if: env.IS_HOLIDAY != 'True'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FORCE_RUN: ${{ env.FORCE_RUN }}
        run: python scanner_tiingo.py

      - name: Commit updated data
        if: env.IS_HOLIDAY != 'True'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Stash scanner output, sync with remote, then restore
          git stash --include-untracked
          git fetch origin main
          git rebase origin/main
          git stash pop || true

          git add data/latest.json                     2>/dev/null || true
          git add data/candles.json                    2>/dev/null || true
          git add data/index_changes.json              2>/dev/null || true
          git add data/index_news.json                 2>/dev/null || true
          git add data/sp500_symbols.txt               2>/dev/null || true
          git add data/nasdaq100_symbols.txt           2>/dev/null || true
          git add data/fundamentals_cache.json         2>/dev/null || true
          git add archive/results_*.csv               2>/dev/null || true
          git add archive/compare_*.log               2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:main
          fi

      - name: Install video dependencies
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True' && env.IS_VIDEO_RUN == 'True'
        run: |
          pip install -r video/requirements.txt
          sudo apt-get install -y fonts-noto-cjk

      - name: Select daily video types
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True' && env.IS_VIDEO_RUN == 'True'
        run: |
          DOW=$(date +%u)   # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri
          if [ "$DOW" = "1" ]; then
            echo "VIDEO_TYPES=volume_spikes volume_spikes_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "2" ]; then
            echo "VIDEO_TYPES=best_performer best_performer_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "3" ]; then
            echo "VIDEO_TYPES=6m_breakout 6m_breakout_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "4" ]; then
            echo "VIDEO_TYPES=1y_vol_peak 1y_vol_peak_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "5" ]; then
            echo "VIDEO_TYPES=index_spotlight index_spotlight_cn" >> $GITHUB_ENV
          else
            echo "VIDEO_TYPES=" >> $GITHUB_ENV
          fi

      - name: Generate daily videos
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        run: |
          for type in $VIDEO_TYPES; do
            python video/generate_video.py --type $type
          done

      - name: Upload daily videos to YouTube
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True' && env.IS_VIDEO_RUN == 'True' && env.VIDEO_TYPES != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DATE=$(python -c "import json; print(json.load(open('data/latest.json'))['date'])")
          for type in $VIDEO_TYPES; do
            if [ -f "video/${type}.mp4" ]; then
              python video/upload_youtube.py --file video/${type}.mp4 --type $type --date $DATE
            else
              echo "Skipping $type — no qualifying stocks today"
            fi
          done
