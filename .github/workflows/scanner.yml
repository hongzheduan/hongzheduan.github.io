name: Baizora Scanner

on:
  schedule:
    - cron: "30 20 * * 1-5"   # weekdays 8:30 PM UTC – scan + daily videos
    - cron: "0 0 * * 6"        # Saturday midnight UTC – incremental scan (no wipe; empty files auto-retried)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check market holiday
        run: |
          IS_HOLIDAY=$(python -c "from scanner_massive import is_market_holiday; print(is_market_holiday())")
          echo "IS_HOLIDAY=$IS_HOLIDAY" >> $GITHUB_ENV
          DOW=$(date +%u)   # 1=Mon … 5=Fri, 6=Sat, 7=Sun
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ]; then
            echo "IS_WEEKEND=True" >> $GITHUB_ENV
            echo "Weekend run — fundamentals refresh only, no videos."
          else
            echo "IS_WEEKEND=False" >> $GITHUB_ENV
          fi

      - name: Run scanner
        if: env.IS_HOLIDAY != 'True'
        run: python scanner_massive.py

      - name: Generate stock pages
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True'
        continue-on-error: true
        run: python generate_stock_pages.py NVDA GOOGL AAPL MSFT AMZN AVGO TSLA META WMT MU

      - name: Commit updated latest.json
        if: env.IS_HOLIDAY != 'True'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Stash scanner output, sync with remote, then restore
          git stash --include-untracked
          git fetch origin main
          git rebase origin/main
          git stash pop

          git add data/latest.json || echo "data/latest.json not found, skipping"
          git add stocks/ 2>/dev/null || echo "No stock pages found, skipping"
          git add data/index_changes.json 2>/dev/null || echo "data/index_changes.json not found, skipping"
          git add data/index_news.json 2>/dev/null || echo "data/index_news.json not found, skipping"
          git add data/sp500_symbols.txt data/nasdaq100_symbols.txt 2>/dev/null || echo "Symbol files not found, skipping"
          git add data/fundamentals_cache.json 2>/dev/null || echo "fundamentals_cache.json not found, skipping"
          git add data/candles.json 2>/dev/null || echo "candles.json not found, skipping"
          git add data/ohlcv_cache/ 2>/dev/null || echo "No ohlcv_cache files found, skipping"
          git add archive/*.csv 2>/dev/null || echo "No archive csv files found, skipping"

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto update $(date -u)"
            git push origin HEAD:main
          fi

      - name: Install video dependencies
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True'
        run: |
          pip install -r video/requirements.txt
          sudo apt-get install -y fonts-noto-cjk

      - name: Select daily video types
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True'
        run: |
          DOW=$(date +%u)   # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri
          if [ "$DOW" = "1" ]; then
            echo "VIDEO_TYPES=volume_spikes volume_spikes_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "2" ]; then
            echo "VIDEO_TYPES=best_performer best_performer_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "3" ]; then
            echo "VIDEO_TYPES=6m_breakout 6m_breakout_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "4" ]; then
            echo "VIDEO_TYPES=1y_vol_peak 1y_vol_peak_cn" >> $GITHUB_ENV
          elif [ "$DOW" = "5" ]; then
            echo "VIDEO_TYPES=index_spotlight index_spotlight_cn" >> $GITHUB_ENV
          else
            echo "VIDEO_TYPES=" >> $GITHUB_ENV
          fi

      - name: Generate daily videos
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True' && env.VIDEO_TYPES != ''
        run: |
          for type in $VIDEO_TYPES; do
            python video/generate_video.py --type $type
          done

      - name: Upload daily videos to YouTube
        if: env.IS_HOLIDAY != 'True' && env.IS_WEEKEND != 'True' && env.VIDEO_TYPES != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DATE=$(python -c "import json; print(json.load(open('data/latest.json'))['date'])")
          for type in $VIDEO_TYPES; do
            if [ -f "video/${type}.mp4" ]; then
              python video/upload_youtube.py --file video/${type}.mp4 --type $type --date $DATE
            else
              echo "Skipping $type — no qualifying stocks today"
            fi
          done