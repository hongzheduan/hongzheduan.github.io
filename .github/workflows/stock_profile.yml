name: Stock Profile Video

# Daily general-information Short about one S&P 500 / Nasdaq-100 company
# (video/generate_stock_profile.py), uploaded to the main Baizora channel
# (@baizorastock, YOUTUBE_REFRESH_TOKEN) every day including weekends. Added 2026-10-21.
# EN only, info-only (no website mention). Uses the last committed close in
# data/latest.json, so the morning run profiles the stock as of the prior session.
#
# The company is picked deterministically from the date (market-cap order, one per
# day), so the retry run always re-picks the same stock. data/latest_video_profile_meta.json
# records the last uploaded date, so once one run uploads the retry no-ops.
#
# To stop: set STOCK_PROFILE_VIDEO to "off" below (or disable the workflow in the
# Actions tab). Nothing else depends on it.

on:
  schedule:
    # Fixed UTC (ET shifts an hour with DST) plus GitHub's ~40-90 min dispatch delay.
    - cron: "30 14 * * *"   # 10:30 AM EDT (9:30 AM EST) every day
    - cron: "30 18 * * *"   # 2:30 PM EDT retry
  workflow_dispatch:
    inputs:
      date:
        description: "Profile date YYYY-MM-DD, which picks the company (default: today ET)"
        required: false
        default: ""
      force:
        description: "Upload even if this date already has a Stock Profile"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-profile
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STOCK_PROFILE_VIDEO: "on"

jobs:
  stock-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Decide whether to run
        run: |
          PROFILE_DATE="${{ github.event.inputs.date }}"
          [ -z "$PROFILE_DATE" ] && PROFILE_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          echo "PROFILE_DATE=$PROFILE_DATE" >> $GITHUB_ENV

          GO=1
          if [ "${{ env.STOCK_PROFILE_VIDEO }}" != "on" ]; then
            echo "STOCK_PROFILE_VIDEO is off"; GO=0
          elif [ "${{ github.event.inputs.force }}" != "true" ] && \
               [ "$(python3 -c "import json; print(json.load(open('data/latest_video_profile_meta.json')).get('date',''))" 2>/dev/null)" = "$PROFILE_DATE" ]; then
            echo "Stock Profile for $PROFILE_DATE already uploaded"; GO=0
          fi
          echo "GO=$GO" >> $GITHUB_ENV

      - name: Set up Python
        if: env.GO == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: env.GO == '1'
        run: |
          pip install -r requirements.txt
          pip install -r video/requirements.txt
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate Stock Profile video
        if: env.GO == '1'
        run: python video/generate_stock_profile.py --date "$PROFILE_DATE" --output video/stock_profile.mp4

      - name: Upload to YouTube
        if: env.GO == '1' && hashFiles('video/stock_profile.mp4') != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          eval "$(python3 -c "
          import json, shlex
          m = json.load(open('video/stock_profile.json'))
          print('SUBJECT=' + shlex.quote(m['ticker'] + '|' + m['name']))
          print('DATA_DATE=' + shlex.quote(m['data_date']))
          print('TICKER=' + shlex.quote(m['ticker']))
          ")"
          OUT=$(python video/upload_youtube.py --file video/stock_profile.mp4 --type stock_profile --date "$DATA_DATE" --subject "$SUBJECT")
          echo "$OUT"
          YT_URL=$(echo "$OUT" | grep '^YOUTUBE_URL=' | cut -d= -f2-)
          if [ -z "$YT_URL" ]; then
            echo "Upload failed; the retry cron will try again"
            exit 1
          fi
          echo "YT_URL=$YT_URL" >> $GITHUB_ENV
          echo "TICKER=$TICKER" >> $GITHUB_ENV

      - name: Record uploaded date
        if: env.GO == '1' && env.YT_URL != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -c "import json,os; json.dump({'date': os.environ['PROFILE_DATE'], 'ticker': os.environ['TICKER'], 'url': os.environ['YT_URL']}, open('data/latest_video_profile_meta.json','w'))"
            git add data/latest_video_profile_meta.json
            git commit -m "auto update stock profile video $PROFILE_DATE ($TICKER)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1
